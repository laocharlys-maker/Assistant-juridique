<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Accès & quotas</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .quota-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 6px; }
    .quota-table td { padding: 6px; border-bottom: 1px solid var(--border); }
    .field-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .field-row label { margin: 0; font-weight: 400; min-width: 220px; }
    .field-row input { margin: 0; width: 140px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-hero">
      <div class="eyebrow">Plateforme</div>
      <h1>Accès & quotas</h1>
      <p>Durée d'accès, nombre de comptes autorisés et plafonds de génération de documents, cabinet par cabinet.</p>
    </div>

    <div id="error" class="error"></div>

    <div class="card">
      <label>Cabinet</label>
      <select id="cabinet-select"><option value="">Chargement…</option></select>
    </div>

    <div id="details-box"></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function formatDateHeure(iso) {
      if (!iso) return "jamais connecté";
      return new Date(iso).toLocaleString("fr-FR", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function essaiStatusHtml(c) {
      if (!c.essaiExpireLe) return '<span class="muted">Accès permanent</span>';
      const expire = new Date(c.essaiExpireLe);
      const joursRestants = Math.ceil((expire.getTime() - Date.now()) / 86400000);
      const expireStr = expire.toLocaleDateString("fr-FR");
      if (joursRestants < 0) {
        return `<span style="color:var(--danger); font-weight:600;">Essai expiré le ${expireStr}</span>`;
      }
      return `<span>Essai jusqu'au ${expireStr} (${joursRestants} j restants)</span>`;
    }

    let cabinets = [];

    async function loadDetails(cabinetId) {
      const box = document.getElementById("details-box");
      const errorEl = document.getElementById("error");
      hideError(errorEl);
      if (!cabinetId) {
        box.innerHTML = "";
        return;
      }
      const cabinet = cabinets.find((c) => c.id === cabinetId);
      box.innerHTML = '<div class="card"><p class="muted">Chargement…</p></div>';
      try {
        const activite = await apiFetch(`/api/admin/cabinets/${cabinetId}/activite`);
        box.innerHTML = `
          <div class="card">
            <h2 style="margin-top:0;">Durée d'accès</h2>
            <p>${essaiStatusHtml(cabinet)}</p>
            <div class="field-row">
              <label>Prolonger l'essai de :</label>
              <input type="number" min="1" max="365" id="prolonger-input" placeholder="jours" />
              <button type="button" class="secondary btn-sm" id="prolonger-btn">Prolonger</button>
              ${cabinet.essaiExpireLe ? '<button type="button" class="ghost btn-sm" id="retirer-essai-btn">Passer en accès permanent</button>' : ""}
            </div>
          </div>

          <div class="card">
            <h2 style="margin-top:0;">Comptes et quotas de génération</h2>
            <div class="field-row">
              <label>Nombre de comptes maximum (tous rôles) :</label>
              <input type="number" min="1" max="10000" id="limite-comptes-input" value="${cabinet.limiteComptes ?? ""}" placeholder="illimité" />
              <span class="muted">${cabinet._count.users} compte(s) actuellement</span>
            </div>
            <div class="field-row">
              <label>Documents générés / mois (tout le cabinet) :</label>
              <input type="number" min="1" max="100000" id="limite-cabinet-input" value="${cabinet.limiteDocumentsCabinetParMois ?? ""}" placeholder="illimité" />
            </div>
          </div>

          <div class="card">
            <h2 style="margin-top:0;">Quota par compte</h2>
            <p class="muted">Plafond mensuel de documents générés, propre à un compte précis (prime sur le plafond global ci-dessus s'il est plus restrictif).</p>
            <table class="quota-table">
              <thead><tr><td><strong>Compte</strong></td><td><strong>Dernière connexion</strong></td><td style="text-align:right;"><strong>Limite/mois</strong></td></tr></thead>
              <tbody>
                ${activite.utilisateurs
                  .map(
                    (u) => `
                  <tr>
                    <td>${escapeHtml(u.nom)} <span class="muted">(${u.role}${u.actif ? "" : ", désactivé"})</span></td>
                    <td>${formatDateHeure(u.lastLoginAt)}</td>
                    <td style="text-align:right;"><input type="number" min="1" max="100000" value="${u.limiteDocumentsParMois ?? ""}" placeholder="illimité" data-quota-user="${u.id}" style="width:90px; margin:0; padding:3px 6px; font-size:0.82rem;" /></td>
                  </tr>`
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById("prolonger-btn").addEventListener("click", async () => {
          const jours = Number(document.getElementById("prolonger-input").value);
          if (!jours || jours < 1) {
            showError(errorEl, "Indique un nombre de jours valide.");
            return;
          }
          try {
            await apiFetch(`/api/admin/cabinets/${cabinetId}`, { method: "PATCH", body: { prolongerJours: jours } });
            await reloadCabinets(cabinetId);
          } catch (err) {
            showError(errorEl, err.message);
          }
        });

        const retirerBtn = document.getElementById("retirer-essai-btn");
        if (retirerBtn) {
          retirerBtn.addEventListener("click", async () => {
            if (!confirm("Retirer la limite d'essai et donner un accès permanent à ce cabinet ?")) return;
            try {
              await apiFetch(`/api/admin/cabinets/${cabinetId}`, { method: "PATCH", body: { retirerLimiteEssai: true } });
              await reloadCabinets(cabinetId);
            } catch (err) {
              showError(errorEl, err.message);
            }
          });
        }

        document.getElementById("limite-comptes-input").addEventListener("change", async (e) => {
          const valeur = e.target.value ? Number(e.target.value) : null;
          try {
            await apiFetch(`/api/admin/cabinets/${cabinetId}`, { method: "PATCH", body: { limiteComptes: valeur } });
            await reloadCabinets(cabinetId);
          } catch (err) {
            showError(errorEl, err.message);
          }
        });

        document.getElementById("limite-cabinet-input").addEventListener("change", async (e) => {
          const valeur = e.target.value ? Number(e.target.value) : null;
          try {
            await apiFetch(`/api/admin/cabinets/${cabinetId}`, { method: "PATCH", body: { limiteDocumentsCabinetParMois: valeur } });
          } catch (err) {
            showError(errorEl, err.message);
          }
        });

        box.querySelectorAll("[data-quota-user]").forEach((input) => {
          input.addEventListener("change", async () => {
            const valeur = input.value ? Number(input.value) : null;
            try {
              await apiFetch(`/api/admin/users/${input.dataset.quotaUser}/quota`, {
                method: "PATCH",
                body: { limiteDocumentsParMois: valeur },
              });
            } catch (err) {
              showError(errorEl, err.message);
            }
          });
        });
      } catch (err) {
        box.innerHTML = `<div class="card"><p class="error visible">${escapeHtml(err.message)}</p></div>`;
      }
    }

    async function reloadCabinets(keepSelectedId) {
      cabinets = await apiFetch("/api/admin/cabinets");
      const select = document.getElementById("cabinet-select");
      select.innerHTML =
        '<option value="">— Choisir un cabinet —</option>' +
        cabinets.map((c) => `<option value="${c.id}"${c.id === keepSelectedId ? " selected" : ""}>${escapeHtml(c.nom)}</option>`).join("");
      await loadDetails(keepSelectedId || "");
    }

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);
      const params = new URLSearchParams(window.location.search);
      const cabinetId = params.get("cabinet") || "";
      try {
        await reloadCabinets(cabinetId);
      } catch (err) {
        showError(document.getElementById("error"), err.message);
      }
    })();

    document.getElementById("cabinet-select").addEventListener("change", (e) => {
      const url = new URL(window.location.href);
      if (e.target.value) url.searchParams.set("cabinet", e.target.value);
      else url.searchParams.delete("cabinet");
      window.history.replaceState({}, "", url);
      loadDetails(e.target.value);
    });
  </script>
</body>
</html>
