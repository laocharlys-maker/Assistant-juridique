<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Facturation</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <div class="page-hero">
      <div class="eyebrow">Cabinet</div>
      <h1>Facturation</h1>
      <p>Suivi interne des honoraires et des paiements. Ce n'est pas une facture normalisée au sens fiscal (SYGMEF) : celle-ci reste émise séparément par l'avocat sur son propre compte SYGMEF.</p>
    </div>

    <div id="error" class="error"></div>

    <div style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
      <button type="button" class="tab" id="btn-facture-normale">+ Créer une facture</button>
      <button type="button" class="tab" id="btn-facture-proforma">+ Créer une facture proforma</button>
    </div>

    <div class="collapse-panel" id="add-panel">
      <div class="collapse-panel-inner">
        <div class="card">
          <h2 id="form-title">Nouvelle facture</h2>
          <form id="facture-form">
            <input type="hidden" name="estProforma" id="est-proforma-input" value="false" />
            <label>Client</label>
            <input name="clientNom" id="client-input" list="clients-datalist-fact" required placeholder="Choisis un client existant ou saisis-en un nouveau" />
            <datalist id="clients-datalist-fact"></datalist>
            <label>Dossier lié (optionnel)</label>
            <select name="dossierId" id="dossier-select">
              <option value="">— aucun —</option>
            </select>
            <label>Description</label>
            <textarea name="description" required placeholder="ex: Honoraires - Consultation et rédaction d'assignation"></textarea>
            <label>Montant HT (F CFA)</label>
            <input name="montant" id="montant-input" type="number" min="1" step="1" required />
            <label style="display:flex; align-items:center; gap:8px; font-weight:400;">
              <input type="checkbox" name="appliquerTva" id="tva-checkbox" style="width:auto;" />
              Appliquer la TVA (18%)
            </label>
            <p class="muted" id="tva-preview"></p>
            <label>Échéance (optionnel)</label>
            <input name="dateEcheance" type="date" />
            <div style="display:flex; gap:10px; margin-top:18px;">
              <button type="submit" id="submit-facture-btn">Créer la facture</button>
              <button type="button" class="ghost" id="cancel-add-btn">Annuler</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Factures</h2>
      <div id="factures-list"><p class="muted">Chargement…</p></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function formatDate(iso) {
      return formatDateLongue(iso);
    }

    function formatMontant(montant) {
      return `${montant.toLocaleString("fr-FR")} F CFA`;
    }

    const STATUT_LABELS = { brouillon: "Brouillon", envoyee: "Envoyée", payee: "Payée" };

    const errorEl = document.getElementById("error");
    const clientInput = document.getElementById("client-input");
    const dossierSelect = document.getElementById("dossier-select");
    const listEl = document.getElementById("factures-list");
    const addPanel = document.getElementById("add-panel");

    let allDossiers = [];
    let allClients = [];

    function renderDossierOptions(dossiers) {
      dossierSelect.innerHTML =
        '<option value="">— aucun —</option>' +
        dossiers.map((d) => `<option value="${d.id}">${escapeHtml(d.numeroDossier)} — ${escapeHtml(d.nomAffaire)}</option>`).join("");
    }

    function dossiersDuClientNom(nom) {
      const nomLower = nom.trim().toLowerCase();
      if (!nomLower) return allDossiers;
      const client = allClients.find((c) => c.nom.trim().toLowerCase() === nomLower);
      if (!client) return [];
      return allDossiers.filter(
        (d) => d.clientId === client.id || d.nomClient.trim().toLowerCase() === nomLower
      );
    }

    async function loadClientsEtDossiers() {
      const [{ dossiers }, clients] = await Promise.all([
        apiFetch("/api/dossiers?scope=cabinet"),
        apiFetch("/api/clients"),
      ]);
      allDossiers = dossiers;
      allClients = clients;

      document.getElementById("clients-datalist-fact").innerHTML = clients
        .map((c) => `<option value="${escapeHtml(c.nom)}"></option>`)
        .join("");

      renderDossierOptions(allDossiers);

      const params = new URLSearchParams(window.location.search);
      const preselect = params.get("dossierId");
      if (preselect) {
        const dossier = allDossiers.find((d) => d.id === preselect);
        if (dossier) {
          const client = clients.find(
            (c) => c.id === dossier.clientId || c.nom.trim().toLowerCase() === dossier.nomClient.trim().toLowerCase()
          );
          if (client) {
            clientInput.value = client.nom;
            renderDossierOptions(dossiersDuClientNom(client.nom));
          }
          dossierSelect.value = preselect;
          addPanel.classList.add("open");
        }
      }
    }

    clientInput.addEventListener("input", () => {
      renderDossierOptions(dossiersDuClientNom(clientInput.value));
    });

    function updateTvaPreview() {
      const montant = Number(document.getElementById("montant-input").value) || 0;
      const previewEl = document.getElementById("tva-preview");
      if (!document.getElementById("tva-checkbox").checked || montant <= 0) {
        previewEl.textContent = "";
        return;
      }
      const tva = Math.round(montant * 0.18);
      const ttc = montant + tva;
      previewEl.textContent = `TVA (18%) : ${formatMontant(tva)} — Total TTC : ${formatMontant(ttc)}`;
    }
    document.getElementById("montant-input").addEventListener("input", updateTvaPreview);
    document.getElementById("tva-checkbox").addEventListener("change", updateTvaPreview);

    function openAddPanel(estProforma) {
      document.getElementById("est-proforma-input").value = String(estProforma);
      document.getElementById("form-title").textContent = estProforma ? "Nouvelle facture proforma" : "Nouvelle facture";
      document.getElementById("submit-facture-btn").textContent = estProforma ? "Créer la facture proforma" : "Créer la facture";
      addPanel.classList.add("open");
      clientInput.focus();
      window.scrollTo({ top: addPanel.offsetTop - 20, behavior: "smooth" });
    }
    document.getElementById("btn-facture-normale").addEventListener("click", () => openAddPanel(false));
    document.getElementById("btn-facture-proforma").addEventListener("click", () => openAddPanel(true));
    document.getElementById("cancel-add-btn").addEventListener("click", () => {
      addPanel.classList.remove("open");
    });

    async function envoyerFacture(id) {
      const email = prompt("Email du destinataire :");
      if (!email) return;
      try {
        await apiFetch(`/api/factures/${id}/envoyer`, { method: "POST", body: { email } });
        loadFactures();
      } catch (err) {
        showError(errorEl, err.message);
      }
    }

    async function marquerPayee(id) {
      try {
        await apiFetch(`/api/factures/${id}`, { method: "PATCH", body: { statut: "payee" } });
        loadFactures();
      } catch (err) {
        showError(errorEl, err.message);
      }
    }

    async function loadFactures() {
      try {
        const factures = await apiFetch("/api/factures");
        if (factures.length === 0) {
          listEl.innerHTML = '<p class="muted">Aucune facture pour l\'instant.</p>';
          return;
        }
        listEl.innerHTML = factures
          .map((f) => {
            const montantTtc = f.appliquerTva ? Math.round(f.montant * 1.18) : f.montant;
            return `
          <div class="action-item">
            <span class="tag">${escapeHtml(f.numero)}${f.dossier ? ` · ${escapeHtml(f.dossier.numeroDossier)} — ${escapeHtml(f.dossier.nomAffaire)}` : ""}</span>
            ${f.estProforma ? '<span class="badge badge-echeance_proche">Proforma</span>' : ""}
            <span class="badge badge-${f.statut}">${STATUT_LABELS[f.statut] || f.statut}</span>
            <div>Client : ${escapeHtml(f.clientNom || f.dossier?.nomClient || "-")}</div>
            <div>${escapeHtml(f.description)}</div>
            <p><strong>${f.appliquerTva ? `${formatMontant(f.montant)} HT — ${formatMontant(montantTtc)} TTC (TVA 18%)` : formatMontant(f.montant)}</strong>${f.dateEcheance ? ` — échéance ${formatDate(f.dateEcheance)}` : ""}</p>
            <p class="muted">Émise le ${formatDate(f.dateEmission)} par ${escapeHtml(f.creePar?.nom || "-")}${f.envoyeAt ? ` · envoyée le ${formatDate(f.envoyeAt)}${f.destinataireEmail ? " à " + escapeHtml(f.destinataireEmail) : ""}` : ""}${f.payeeAt ? ` · payée le ${formatDate(f.payeeAt)}` : ""}</p>
            <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
              <a class="secondary" href="/api/factures/${f.id}/pdf" target="_blank" style="text-decoration:none; margin:0;">Télécharger le PDF</a>
              <button type="button" class="secondary" style="margin:0;" data-envoyer="${f.id}">Envoyer par email</button>
              ${f.statut !== "payee" ? `<button type="button" class="secondary" style="margin:0;" data-payee="${f.id}">Marquer payée</button>` : ""}
            </div>
          </div>`;
          })
          .join("");

        listEl.querySelectorAll("[data-envoyer]").forEach((btn) => {
          btn.addEventListener("click", () => envoyerFacture(btn.dataset.envoyer));
        });
        listEl.querySelectorAll("[data-payee]").forEach((btn) => {
          btn.addEventListener("click", () => marquerPayee(btn.dataset.payee));
        });
      } catch (err) {
        listEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    }

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);
      if (me.role !== "titulaire" && me.role !== "avocat") {
        document.querySelector(".page").innerHTML =
          '<p class="error visible">Cette page est réservée aux avocats et à l\'administrateur du cabinet.</p>';
        return;
      }
      await Promise.all([loadClientsEtDossiers(), loadFactures()]);
    })();

    document.getElementById("facture-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorEl);
      const fd = new FormData(e.target);
      try {
        await apiFetch("/api/factures", {
          method: "POST",
          body: {
            clientNom: fd.get("clientNom"),
            dossierId: fd.get("dossierId") || undefined,
            description: fd.get("description"),
            montant: Number(fd.get("montant")),
            appliquerTva: document.getElementById("tva-checkbox").checked,
            estProforma: document.getElementById("est-proforma-input").value === "true",
            dateEcheance: fd.get("dateEcheance") || undefined,
          },
        });
        e.target.reset();
        document.getElementById("tva-preview").textContent = "";
        addPanel.classList.remove("open");
        loadFactures();
      } catch (err) {
        showError(errorEl, err.message);
      }
    });
  </script>
</body>
</html>
