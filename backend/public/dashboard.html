<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Documents générés</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <h1 id="greeting">Documents générés</h1>
    <p class="muted" id="subtitle" style="display:none;"></p>

    <div class="tabs" id="vue-tabs">
      <button class="tab active" data-vue="dossiers">Dossiers</button>
      <button class="tab" data-vue="recherches">Recherches</button>
      <button class="tab" data-vue="traductions">Documents traduits</button>
      <button class="tab" data-vue="transcriptions">Documents transcrits</button>
      <button class="tab" data-vue="archives">Archives</button>
    </div>

    <div class="tabs" id="scope-tabs" style="display:none;">
      <button class="tab active" data-scope="mine">Mes dossiers</button>
      <button class="tab" data-scope="cabinet">Dossiers du cabinet</button>
    </div>

    <input type="search" id="dossiers-search" placeholder="Rechercher par numéro ou nom d'affaire…" style="margin-bottom:14px;" />

    <div class="card">
      <div id="dossiers-list"><p class="muted">Chargement…</p></div>
    </div>

    <!-- Lot 17 (suite) - vue "Documents transcrits" : memes actions que
         l'onglet "Pieces" d'un dossier (public/dossier.html), sans y
         renvoyer - modale de detail statique, cablee une seule fois. -->
    <div class="modal-overlay" id="ocr-modal" hidden>
      <div class="modal-box" style="max-width:640px;">
        <h2>Texte reconnu</h2>
        <p class="muted" id="ocr-modal-meta"></p>
        <p class="error visible" id="ocr-modal-warning" style="display:none;"></p>
        <p class="error visible" id="ocr-modal-error" style="display:none;"></p>
        <textarea id="ocr-modal-texte" readonly style="width:100%; min-height:320px; font-family:inherit; resize:vertical;"></textarea>
        <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
          <button type="button" class="ghost" id="ocr-modal-pdf">Télécharger PDF</button>
          <button type="button" class="ghost" id="ocr-modal-word">Télécharger Word</button>
          <button type="button" class="ghost" id="ocr-modal-copier">Copier vers un document en rédaction libre</button>
          <button type="button" class="secondary" id="ocr-modal-fermer">Fermer</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/envoiActions.js"></script>
  <script>
    let currentScope = "mine";
    let currentVue = "dossiers";
    let currentUserRole = null;
    let currentDocuments = [];
    let envoiContext = null;

    // Libelle affiche pour chaque type de document dans la "Vue par type" -
    // memes intitules que le reste de l'appli (nouvelle-action.html,
    // dossier.html, tableau-de-bord.html).
    const TYPE_LABELS = {
      notes: "Compte-rendu d'audience",
      redac: "Plaidoirie",
      conclusions: "Conclusions",
      assignation: "Assignation",
      mise_en_demeure: "Mise en demeure",
      jurisprudence: "Recherche de jurisprudence",
      recherche_juridique: "Recherche juridique",
      resume_pdf: "Résumé de jurisprudence",
      veille_juridique: "Veille juridique",
      traduction: "Traduction",
      plainte: "Plainte",
      contrat: "Contrat",
      notification_date: "Notification",
      requete: "Requête",
      projet_ordonnance: "Projet d'ordonnance",
      note_plaidoirie: "Note de plaidoirie",
    };

    function estVueDossierPourScope(vue) {
      return vue === "dossiers" || vue === "archives" || vue === "transcriptions";
    }

    // Meme table d'icones que public/dossier.html (onglet Pieces) - dupliquee
    // ici volontairement (petit helper cote client, pas de module JS partage
    // entre pages dans ce projet).
    const TYPE_ICONES_TRANSCRIPTIONS = {
      "application/pdf": "📄",
    };
    function iconeTranscription(typeMime) {
      if (typeMime.startsWith("image/")) return "🖼️";
      return TYPE_ICONES_TRANSCRIPTIONS[typeMime] || "📎";
    }

    async function loadListe() {
      const listEl = document.getElementById("dossiers-list");
      listEl.innerHTML = '<p class="muted">Chargement…</p>';
      const peutVoirCabinet =
        currentUserRole === "titulaire" || currentUserRole === "avocat" || currentUserRole === "collaborateur";

      try {
        const { documents, scope: appliedScope, vue: appliedVue } = await apiFetch(
          `/api/documents?scope=${currentScope}&vue=${currentVue}`
        );
        currentScope = appliedScope;
        currentVue = appliedVue;
        document.querySelectorAll("#scope-tabs .tab").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.scope === appliedScope);
        });
        document.querySelectorAll("#vue-tabs .tab").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.vue === appliedVue);
        });
        document.getElementById("scope-tabs").style.display =
          peutVoirCabinet && estVueDossierPourScope(appliedVue) ? "flex" : "none";
        currentDocuments = documents;
        document.getElementById("dossiers-search").value = "";
        if (currentVue === "transcriptions") {
          renderTranscriptions(documents);
        } else {
          renderDocumentsByType(documents);
        }
      } catch (err) {
        listEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    }

    // Regroupe les documents par type (Assignations ensemble, Comptes-rendus
    // ensemble...), chaque groupe deja trie du plus recent au plus ancien
    // (l'API renvoie les documents tries par date de creation decroissante).
    // Un accordeon replie par defaut par type : le plus simple a lire quand
    // il y a beaucoup de documents, on ne voit le detail qu'en cliquant.
    function renderDocumentsByType(documents) {
      const listEl = document.getElementById("dossiers-list");
      if (documents.length === 0) {
        const emptyLabels = {
          dossiers: "Aucun document pour l'instant.",
          recherches: "Aucune recherche pour l'instant.",
          traductions: "Aucun document traduit pour l'instant.",
          archives: "Aucun document archivé pour l'instant.",
        };
        listEl.innerHTML = `<p class="muted">${emptyLabels[currentVue] || "Aucun résultat."}</p>`;
        return;
      }

      const groupes = new Map();
      documents.forEach((doc) => {
        if (!groupes.has(doc.typeAction)) groupes.set(doc.typeAction, []);
        groupes.get(doc.typeAction).push(doc);
      });

      const typesTries = Array.from(groupes.keys()).sort((a, b) => {
        const labelA = TYPE_LABELS[a] || a;
        const labelB = TYPE_LABELS[b] || b;
        return labelA.localeCompare(labelB, "fr");
      });

      listEl.innerHTML = typesTries
        .map((type) => {
          const docs = groupes.get(type);
          const lignes = docs
            .map((doc) => {
              const titre = doc.nomDocument || TYPE_LABELS[doc.typeAction] || doc.typeAction;
              const date = formatDateLongue(doc.createdAt);
              const meta = `${escapeHtml(doc.dossier.numeroDossier)} — ${escapeHtml(doc.dossier.nomAffaire)} · ${date} · créé par ${escapeHtml(doc.creePar.nom)}`;
              const badgeCloture =
                doc.dossier.statut === "cloture" ? ' <span class="tag">Clôturé</span>' : "";
              const badgeEcheance =
                doc.dossier.statutTag === "echeance_proche"
                  ? ' <span class="badge badge-echeance_proche">Échéance proche</span>'
                  : "";
              const envoiControls = envoiContext ? renderEnvoiControls(doc, envoiContext) : "";
              return `
            <div class="dossier-item">
              <div>
                <div><a href="/dossier.html?id=${doc.dossier.id}">${escapeHtml(titre)}</a>${badgeCloture}${badgeEcheance}</div>
                <div class="meta">${meta}</div>
                ${envoiControls}
              </div>
            </div>`;
            })
            .join("");
          return `
        <div class="accordion-item">
          <button type="button" class="accordion-header" data-accordion-toggle>
            <div><strong>${escapeHtml(TYPE_LABELS[type] || type)}</strong> <span class="muted">(${docs.length})</span></div>
          </button>
          <div class="accordion-body">${lignes}</div>
        </div>`;
        })
        .join("");

      listEl.querySelectorAll("[data-accordion-toggle]").forEach((header) => {
        header.addEventListener("click", () => {
          header.closest(".accordion-item").classList.toggle("open");
        });
      });

      if (envoiContext) {
        bindEnvoiHandlers(listEl, envoiContext, () => loadListe());
      }
    }

    // "Documents transcrits" (Lot 17) : pieces de dossier dont l'OCR est
    // termine (voir /api/documents?vue=transcriptions, dossiers.ts) - liste
    // plate (pas de regroupement par type, contrairement a
    // renderDocumentsByType : une piece scannee n'a pas de "type" d'acte).
    // Memes actions que l'onglet "Pieces" de la fiche dossier (Aperçu,
    // Télécharger, Voir le texte reconnu, Relancer la reconnaissance) -
    // directement ici, sans devoir naviguer vers le dossier.
    function renderTranscriptions(pieces) {
      const listEl = document.getElementById("dossiers-list");
      if (pieces.length === 0) {
        listEl.innerHTML = '<p class="muted">Aucun document transcrit pour l\'instant.</p>';
        return;
      }

      listEl.innerHTML = pieces
        .map((p) => {
          const date = formatDateLongue(p.createdAt);
          const meta = `${escapeHtml(p.dossier.numeroDossier)} — ${escapeHtml(p.dossier.nomAffaire)} · ${date} · ajouté par ${escapeHtml(p.uploadePar.nom)}`;
          const badgeCloture = p.dossier.statut === "cloture" ? ' <span class="tag">Clôturé</span>' : "";
          const badgeEcheance =
            p.dossier.statutTag === "echeance_proche"
              ? ' <span class="badge badge-echeance_proche">Échéance proche</span>'
              : "";
          const score = typeof p.ocrResultat.scoreConfiance === "number" ? Math.round(p.ocrResultat.scoreConfiance) : null;
          // Seuil identique a OCR_SEUIL_CONFIANCE_AVERTISSEMENT (public/dossier.html) -
          // a garder synchronise si ce seuil est ajuste un jour.
          const avertissement = score !== null && score < 70 ? ' <span class="badge badge-ocr-echec">⚠️ à relire</span>' : "";
          const scoreTexte = score !== null ? ` · confiance ${score}%` : "";
          const apercuPossible = p.typeMime === "application/pdf" || p.typeMime.startsWith("image/");
          return `
        <div class="dossier-item">
          <div>
            <div>${iconeTranscription(p.typeMime)} <strong>${escapeHtml(p.nomOriginal)}</strong>${badgeCloture}${badgeEcheance}${avertissement}</div>
            <div class="meta">${meta}${scoreTexte}</div>
            <div style="margin-top:6px; display:flex; gap:8px; flex-wrap:wrap;">
              ${apercuPossible ? `<button type="button" class="ghost btn-sm" data-piece-apercu="${p.id}" data-piece-type="${p.typeMime}">Aperçu</button>` : ""}
              <button type="button" class="ghost btn-sm" data-piece-telecharger="${p.id}" data-piece-nom="${escapeHtml(p.nomOriginal)}">Télécharger</button>
              <button type="button" class="ghost btn-sm" data-ocr-voir="${p.id}">Voir le texte reconnu</button>
              <button type="button" class="ghost btn-sm" data-ocr-relancer="${p.id}">Relancer la reconnaissance</button>
              <a class="secondary btn-sm" href="/dossier.html?id=${p.dossier.id}" style="text-decoration:none;">Ouvrir le dossier</a>
            </div>
            <div id="piece-preview-${p.id}" hidden style="margin-top:8px;"></div>
          </div>
        </div>`;
        })
        .join("");

      listEl.querySelectorAll("[data-piece-apercu]").forEach((btn) => {
        btn.addEventListener("click", () => apercevoirTranscription(btn.dataset.pieceApercu, btn.dataset.pieceType));
      });
      listEl.querySelectorAll("[data-piece-telecharger]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await downloadFile(`/api/documents/${btn.dataset.pieceTelecharger}`, btn.dataset.pieceNom);
          } catch (err) {
            alert(err.message);
          }
        });
      });
      listEl.querySelectorAll("[data-ocr-voir]").forEach((btn) => {
        btn.addEventListener("click", () => ouvrirModaleOcr(btn.dataset.ocrVoir));
      });
      listEl.querySelectorAll("[data-ocr-relancer]").forEach((btn) => {
        btn.addEventListener("click", () => relancerOcrTranscription(btn.dataset.ocrRelancer));
      });
    }

    // Memes fonctions (aperçu inline, modale de detail OCR) que l'onglet
    // "Pieces" de la fiche dossier (public/dossier.html) - dupliquees ici
    // volontairement (page distincte, pas de module JS partage entre pages
    // dans ce projet) pour eviter d'avoir a naviguer vers le dossier juste
    // pour consulter/relancer une transcription.
    async function apercevoirTranscription(id, typeMime) {
      const previewEl = document.getElementById(`piece-preview-${id}`);
      if (!previewEl) return;
      if (!previewEl.hidden) {
        previewEl.hidden = true;
        previewEl.innerHTML = "";
        return;
      }
      try {
        const response = await fetch(`/api/documents/${id}?inline=1`, { credentials: "include" });
        if (!response.ok) throw new Error("Aperçu indisponible.");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        previewEl.innerHTML = typeMime.startsWith("image/")
          ? `<img src="${url}" style="max-width:100%; border-radius:8px;" />`
          : `<iframe src="${url}" style="width:100%; height:500px; border:1px solid var(--border); border-radius:8px;"></iframe>`;
        previewEl.hidden = false;
      } catch (err) {
        alert(err.message);
      }
    }

    let ocrModalDocumentId = null;
    const OCR_SEUIL_CONFIANCE_AVERTISSEMENT = 70;

    async function ouvrirModaleOcr(documentId) {
      const modal = document.getElementById("ocr-modal");
      const metaEl = document.getElementById("ocr-modal-meta");
      const warningEl = document.getElementById("ocr-modal-warning");
      const errorEl = document.getElementById("ocr-modal-error");
      const texteEl = document.getElementById("ocr-modal-texte");
      if (!modal) return;

      ocrModalDocumentId = documentId;
      metaEl.textContent = "Chargement…";
      warningEl.style.display = "none";
      errorEl.style.display = "none";
      texteEl.value = "";
      modal.hidden = false;

      try {
        const resultat = await apiFetch(`/api/documents/${documentId}/ocr`);
        if (resultat.statut !== "termine") {
          metaEl.textContent = "";
          errorEl.textContent = resultat.messageErreur || "Le texte de cette pièce n'est pas encore disponible.";
          errorEl.style.display = "block";
          return;
        }
        const score = typeof resultat.scoreConfiance === "number" ? Math.round(resultat.scoreConfiance) : null;
        metaEl.textContent = score === null ? "Score de confiance indisponible." : `Score de confiance : ${score}%`;
        if (score !== null && score < OCR_SEUIL_CONFIANCE_AVERTISSEMENT) {
          warningEl.textContent = "⚠️ Score de confiance faible — relecture manuelle recommandée avant toute utilisation de ce texte.";
          warningEl.style.display = "block";
        }
        texteEl.value = resultat.texteExtrait || "";
      } catch (err) {
        metaEl.textContent = "";
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    }

    function fermerModaleOcr() {
      const modal = document.getElementById("ocr-modal");
      if (modal) modal.hidden = true;
      ocrModalDocumentId = null;
    }

    async function relancerOcrTranscription(documentId) {
      try {
        await apiFetch(`/api/documents/${documentId}/ocr/relancer`, { method: "POST" });
        loadListe();
      } catch (err) {
        alert(err.message);
      }
    }

    function wireOcrModal() {
      const modal = document.getElementById("ocr-modal");
      if (!modal) return;
      document.getElementById("ocr-modal-fermer").addEventListener("click", fermerModaleOcr);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) fermerModaleOcr();
      });
      document.getElementById("ocr-modal-copier").addEventListener("click", () => {
        const texte = document.getElementById("ocr-modal-texte").value;
        if (!texte || !ocrModalDocumentId) return;
        // Point de depart editable, jamais une creation automatique - meme
        // mecanisme que dossier.html.
        sessionStorage.setItem("aurore_ocr_copie_redaction_libre", JSON.stringify({ texte }));
        window.location.href = "/nouvelle-action.html";
      });
      document.getElementById("ocr-modal-pdf").addEventListener("click", async () => {
        if (!ocrModalDocumentId) return;
        try {
          await downloadFile(`/api/documents/${ocrModalDocumentId}/ocr/pdf`, "texte-reconnu.pdf");
        } catch (err) {
          alert(err.message);
        }
      });
      document.getElementById("ocr-modal-word").addEventListener("click", async () => {
        if (!ocrModalDocumentId) return;
        try {
          await downloadFile(`/api/documents/${ocrModalDocumentId}/ocr/word`, "texte-reconnu.docx");
        } catch (err) {
          alert(err.message);
        }
      });
    }

    function applyDossiersSearch() {
      const terme = document.getElementById("dossiers-search").value.trim().toLowerCase();
      const render = currentVue === "transcriptions" ? renderTranscriptions : renderDocumentsByType;
      if (!terme) {
        render(currentDocuments);
        return;
      }
      const filtres = currentDocuments.filter((doc) => {
        const numero = (doc.dossier.numeroDossier || "").toLowerCase();
        const nom = (doc.dossier.nomAffaire || "").toLowerCase();
        // nomDocument (Action) ou nomOriginal (piece transcrite, Lot 17) -
        // au plus un des deux est renseigne selon currentVue.
        const titre = (doc.nomDocument || doc.nomOriginal || "").toLowerCase();
        return numero.includes(terme) || nom.includes(terme) || titre.includes(terme);
      });
      render(filtres);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);
      document.getElementById("greeting").textContent = `Bienvenue ${me.nom}`;
      wireOcrModal();

      currentUserRole = me.role;
      // Charge une seule fois (jamais filtre par dossier, voir
      // js/envoiActions.js) plutot qu'a chaque rendu de la liste.
      envoiContext = await loadEnvoiContext(me);

      if (me.role === "titulaire" || me.role === "avocat" || me.role === "collaborateur") {
        document.querySelectorAll("#scope-tabs .tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            currentScope = btn.dataset.scope;
            loadListe();
          });
        });
      }
      if (me.role === "collaborateur" && me.responsable) {
        const subtitleEl = document.getElementById("subtitle");
        subtitleEl.textContent = `Dossiers de ${me.responsable.nom}`;
        subtitleEl.style.display = "block";
      }

      document.querySelectorAll("#vue-tabs .tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentVue = btn.dataset.vue;
          loadListe();
        });
      });

      document.getElementById("dossiers-search").addEventListener("input", applyDossiersSearch);

      loadListe();
    })();
  </script>
</body>
</html>
