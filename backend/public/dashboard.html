<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Documents générés</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <h1 id="greeting">Documents générés</h1>
    <p class="muted" id="subtitle" style="display:none;"></p>

    <div class="tabs" id="vue-tabs">
      <button class="tab active" data-vue="dossiers">Dossiers</button>
      <button class="tab" data-vue="recherches">Recherches</button>
      <button class="tab" data-vue="traductions">Documents traduits</button>
    </div>

    <div class="tabs" id="scope-tabs" style="display:none;">
      <button class="tab active" data-scope="mine">Mes dossiers</button>
      <button class="tab" data-scope="cabinet">Vue cabinet</button>
    </div>

    <div class="card">
      <div id="dossiers-list"><p class="muted">Chargement…</p></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let currentScope = "mine";
    let currentVue = "dossiers";
    let currentUserRole = null;

    const STATUT_TAG_LABELS = {
      a_jour: "à jour",
      echeance_proche: "échéance proche",
      cloture: "clôturé",
    };

    async function loadDossiers() {
      const listEl = document.getElementById("dossiers-list");
      listEl.innerHTML = '<p class="muted">Chargement…</p>';
      try {
        const { dossiers, scope: appliedScope, vue: appliedVue } = await apiFetch(
          `/api/dossiers?scope=${currentScope}&vue=${currentVue}`
        );
        currentScope = appliedScope;
        currentVue = appliedVue;
        document.querySelectorAll("#scope-tabs .tab").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.scope === appliedScope);
        });
        document.querySelectorAll("#vue-tabs .tab").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.vue === appliedVue);
        });
        const peutVoirCabinet = currentUserRole === "titulaire" || currentUserRole === "avocat";
        document.getElementById("scope-tabs").style.display =
          peutVoirCabinet && appliedVue === "dossiers" ? "flex" : "none";

        if (dossiers.length === 0) {
          const emptyLabels = {
            dossiers: "Aucun dossier pour l'instant.",
            recherches: "Aucune recherche pour l'instant.",
            traductions: "Aucun document traduit pour l'instant.",
          };
          listEl.innerHTML = `<p class="muted">${emptyLabels[appliedVue]}</p>`;
          return;
        }

        listEl.innerHTML = dossiers
          .map((d) => {
            const titre = appliedVue !== "dossiers" ? d.nomAffaire : `${d.numeroDossier} — ${d.nomAffaire}`;
            const meta = appliedVue !== "dossiers"
              ? `${d._count.actions} action(s) · créé par ${escapeHtml(d.creePar.nom)}`
              : `${escapeHtml(d.nomClient)} · ${d._count.actions} action(s) · créé par ${escapeHtml(d.creePar.nom)}`;
            return `
          <div class="dossier-item">
            <div>
              <span class="badge badge-${d.statutTag}">${STATUT_TAG_LABELS[d.statutTag] || d.statutTag}</span>
              <div><a href="/dossier.html?id=${d.id}">${escapeHtml(titre)}</a></div>
              <div class="meta">${meta}</div>
            </div>
          </div>`;
          })
          .join("");
      } catch (err) {
        listEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);
      document.getElementById("greeting").textContent = `Bienvenue ${me.nom}`;

      currentUserRole = me.role;

      if (me.role === "titulaire" || me.role === "avocat") {
        document.querySelectorAll("#scope-tabs .tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            currentScope = btn.dataset.scope;
            loadDossiers();
          });
        });
      } else if (me.responsable) {
        const subtitleEl = document.getElementById("subtitle");
        subtitleEl.textContent = `Dossiers de ${me.responsable.nom}`;
        subtitleEl.style.display = "block";
      }

      document.querySelectorAll("#vue-tabs .tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentVue = btn.dataset.vue;
          loadDossiers();
        });
      });

      loadDossiers();
    })();
  </script>
</body>
</html>
