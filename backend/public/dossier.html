<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Dossier</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <p><a href="/dashboard.html" id="back-link">&larr; Retour</a></p>
    <div id="content"><p class="muted">Chargement…</p></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/timer.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    // Redirection depuis "Rédiger librement" (Nouvelle action) juste apres
    // creation : pre-coche la case signature du document concerne cote
    // fiche dossier, pour eviter d'avoir a la recocher (l'en-tete du
    // cabinet est deja cochee par defaut, voir cabinetHasEntete dans
    // renderAction). Declare au niveau module (pas dans l'IIFE plus bas) car
    // lu par renderAction, une fonction top-level separee.
    const urlParamsInitiaux = new URLSearchParams(window.location.search);
    const highlightActionId = urlParamsInitiaux.get("actionId");
    const preAvecSignature = highlightActionId && urlParamsInitiaux.get("avecSignature") === "1";

    // Barre d'outils de l'editeur de texte (voir data-md-cmd dans le panneau
    // d'edition) : insere/entoure la syntaxe Markdown correspondante autour
    // de la selection courante, plutot que de demander a l'avocat de la
    // taper lui-meme. Doit rester en phase avec markdownParse.ts (moteur de
    // rendu Word/PDF) et js/markdown.js (apercu).
    function mdWrapSelection(textarea, before, after) {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const value = textarea.value;
      const selected = value.slice(start, end);
      const inserted = `${before}${selected}${after}`;
      textarea.value = value.slice(0, start) + inserted + value.slice(end);
      const cursorStart = start + before.length;
      textarea.setSelectionRange(cursorStart, cursorStart + selected.length);
      textarea.focus();
      textarea.dispatchEvent(new Event("input"));
    }

    // Etend la selection courante aux lignes completes qu'elle touche (pour
    // les commandes qui s'appliquent a des lignes entieres : titres, listes,
    // alignement), meme si la selection ne couvre qu'une partie d'une ligne.
    function mdSelectedLinesRange(textarea) {
      const value = textarea.value;
      let start = textarea.selectionStart;
      let end = textarea.selectionEnd;
      while (start > 0 && value[start - 1] !== "\n") start--;
      while (end < value.length && value[end] !== "\n") end++;
      return { start, end };
    }

    const MD_LINE_MARKERS = [/^\^\^\s?/, /^>\s?/, /^<\s?/, /^#{1,3}\s+/];

    function mdStripLineMarkers(line) {
      for (const re of MD_LINE_MARKERS) {
        if (re.test(line)) return line.replace(re, "");
      }
      return line;
    }

    // Applique (ou retire, si marker est vide - "Justifier" = retour au
    // paragraphe normal, deja justifie par defaut) un marqueur de debut de
    // ligne a toutes les lignes de la selection - un seul marqueur par
    // ligne, le precedent est d'abord retire.
    function mdApplyLineMarker(textarea, marker) {
      const { start, end } = mdSelectedLinesRange(textarea);
      const value = textarea.value;
      const block = value.slice(start, end);
      const newBlock = block
        .split("\n")
        .map((line) => {
          const stripped = mdStripLineMarkers(line);
          return marker ? `${marker}${stripped}` : stripped;
        })
        .join("\n");
      textarea.value = value.slice(0, start) + newBlock + value.slice(end);
      textarea.setSelectionRange(start, start + newBlock.length);
      textarea.focus();
      textarea.dispatchEvent(new Event("input"));
    }

    // Bascule la selection en liste a puces - si toutes les lignes non
    // vides sont deja des puces, les retire (toggle), sinon les ajoute.
    function mdToggleBulletList(textarea) {
      const { start, end } = mdSelectedLinesRange(textarea);
      const value = textarea.value;
      const block = value.slice(start, end);
      const lines = block.split("\n");
      const nonEmptyLines = lines.filter((l) => l.trim() !== "");
      const allBulleted = nonEmptyLines.length > 0 && nonEmptyLines.every((l) => /^\s*-\s+/.test(l));
      const newBlock = lines
        .map((line) => {
          if (line.trim() === "") return line;
          if (allBulleted) return line.replace(/^\s*-\s+/, "");
          return /^\s*-\s+/.test(line) ? line : `- ${line}`;
        })
        .join("\n");
      textarea.value = value.slice(0, start) + newBlock + value.slice(end);
      textarea.setSelectionRange(start, start + newBlock.length);
      textarea.focus();
      textarea.dispatchEvent(new Event("input"));
    }

    function applyMarkdownCommand(textarea, cmd) {
      switch (cmd) {
        case "bold":
          mdWrapSelection(textarea, "**", "**");
          break;
        case "italic":
          mdWrapSelection(textarea, "*", "*");
          break;
        case "h1":
          mdApplyLineMarker(textarea, "# ");
          break;
        case "h2":
          mdApplyLineMarker(textarea, "## ");
          break;
        case "h3":
          mdApplyLineMarker(textarea, "### ");
          break;
        case "bullet":
          mdToggleBulletList(textarea);
          break;
        case "align-left":
          mdApplyLineMarker(textarea, "< ");
          break;
        case "align-center":
          mdApplyLineMarker(textarea, "^^");
          break;
        case "align-right":
          mdApplyLineMarker(textarea, "> ");
          break;
        case "align-justify":
          mdApplyLineMarker(textarea, "");
          break;
      }
    }

    const TYPE_LABELS = {
      notes: "Compte-rendu d'audience",
      redac: "Plaidoirie",
      conclusions: "Conclusions",
      assignation: "Assignation",
      mise_en_demeure: "Mise en demeure",
      jurisprudence: "Recherche de jurisprudence",
      recherche_juridique: "Recherche juridique",
      resume_pdf: "Résumé de jurisprudence",
      veille_juridique: "Veille juridique",
      traduction: "Traduction",
      plainte: "Plainte",
      contrat: "Contrat",
      notification_date: "Notification de date",
      requete: "Requête",
      projet_ordonnance: "Projet d'ordonnance",
      note_plaidoirie: "Note de plaidoirie",
    };

    let me = null;
    let cabinetHasEntete = false;
    let clientsAvecEmail = [];
    let avocatsAnnuaire = [];
    let collaborateursAnnuaire = [];
    let collegues = [];
    let huissiersAnnuaire = [];
    let currentDossierEstRecherche = false;

    // Configuration des boutons d'envoi par type de document : chaque type
    // n'expose que les destinataires qui ont du sens pour lui (ex: une Note
    // de plaidoirie n'est jamais envoyee par email, un huissier ne concerne
    // qu'Assignation/Mise en demeure). Les types absents de cette liste
    // (compte-rendu, plainte, contrat, notification...) gardent le
    // comportement par defaut (client + collegue).
    const ENVOI_CONFIG = {
      redac: { moi: true },
      conclusions: { collegue: true },
      assignation: { huissier: true, collegue: true },
      mise_en_demeure: { huissier: true, collegue: true },
      requete: { moi: true, collegue: true },
      projet_ordonnance: { moi: true, collegue: true },
      resume_pdf: { moi: true, collegue: true },
      jurisprudence: { moi: true, collegue: true },
      recherche_juridique: { moi: true, collegue: true },
      traduction: { moi: true, collegue: true, client: true },
    };
    const DEFAULT_ENVOI_CONFIG = { client: true, collegue: true };
    function envoiConfigFor(typeAction) {
      if (typeAction === "note_plaidoirie") return null;
      return ENVOI_CONFIG[typeAction] || DEFAULT_ENVOI_CONFIG;
    }

    (async () => {
      me = await requireSession();
      if (!me) return;
      initLayout(me);

      try {
        const cabinet = await apiFetch("/api/cabinet");
        cabinetHasEntete = !!cabinet.enteteUrl;
      } catch {
        cabinetHasEntete = false;
      }

      try {
        const clients = await apiFetch("/api/clients");
        clientsAvecEmail = clients.filter((c) => c.email);
      } catch {
        clientsAvecEmail = [];
      }

      try {
        const annuaire = await apiFetch("/api/users/annuaire");
        const autres = annuaire.filter((u) => u.id !== me.id);
        avocatsAnnuaire = autres.filter((u) => u.role === "titulaire" || u.role === "avocat");
        collaborateursAnnuaire = autres.filter((u) => u.role === "collaborateur");
        collegues = avocatsAnnuaire.concat(collaborateursAnnuaire);
      } catch {
        avocatsAnnuaire = [];
        collaborateursAnnuaire = [];
        collegues = [];
      }

      try {
        huissiersAnnuaire = await apiFetch("/api/huissiers");
      } catch {
        huissiersAnnuaire = [];
      }

      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get("id");
      const contentEl = document.getElementById("content");
      if (!id) {
        contentEl.innerHTML = '<p class="error visible">Aucun dossier spécifié.</p>';
        return;
      }

      try {
        const dossier = await apiFetch(`/api/dossiers/${id}`);
        currentDossierEstRecherche = !!dossier.estRecherche;

        document.getElementById("back-link").textContent = currentDossierEstRecherche
          ? "← Retour aux recherches"
          : "← Retour aux dossiers";

        contentEl.innerHTML = `
          <div class="card">
            <div class="dossier-header-row">
              <div class="dossier-header-info">
                <span class="badge badge-${dossier.statutTag}">${STATUT_TAG_LABELS[dossier.statutTag] || dossier.statutTag}</span>
                <h1>${escapeHtml(dossier.numeroDossier)} — ${escapeHtml(dossier.nomAffaire)}</h1>
                <p class="muted">Client : ${escapeHtml(dossier.nomClient)} · Juridiction : ${escapeHtml(dossier.nomJuridiction || "non précisée")}${dossier.nomChambre ? " (" + escapeHtml(dossier.nomChambre) + ")" : ""} · créé par ${escapeHtml(dossier.creePar.nom)}</p>
                ${dossier.archivedAt ? `<p class="muted">Archivé automatiquement le ${formatDateLongue(dossier.archivedAt)} — toujours consultable, réactivable via "Rouvrir le dossier".</p>` : ""}
                ${
                  currentDossierEstRecherche
                    ? ""
                    : `${
                        me.role !== "collaborateur"
                          ? `<button type="button" class="secondary" id="toggle-cloture-btn" data-statut="${dossier.statut}">
                              ${dossier.statut === "cloture" ? "Rouvrir le dossier" : "Clôturer le dossier"}
                            </button>`
                          : ""
                      }
                      ${
                        me.role === "titulaire" || me.role === "avocat"
                          ? `<a class="secondary" href="/factures.html?dossierId=${dossier.id}" style="display:inline-block; text-decoration:none; padding:6px 12px; border-radius:6px; margin-left:8px;">Facturer ce dossier</a>`
                          : ""
                      }
                      <a class="secondary" href="/delais-calculateur.html?dossierId=${dossier.id}" style="display:inline-block; text-decoration:none; padding:6px 12px; border-radius:6px; margin-left:8px;">Calculer un délai</a>`
                }
              </div>
              ${currentDossierEstRecherche ? "" : '<div class="dossier-header-timer" id="timer-section"></div>'}
            </div>
          </div>
          <h2>Historique (${dossier.actions.length})</h2>
          <div id="actions-list"></div>
          <div id="agenda-section"></div>
          <div id="pieces-section"></div>
        `;

        if (!currentDossierEstRecherche) {
          initTimerWidget(id, me);
          loadAgendaDossier(id);
          loadPiecesDossier(id);
        }

        const clotureBtn = document.getElementById("toggle-cloture-btn");
        if (clotureBtn) {
          clotureBtn.addEventListener("click", async (e) => {
            const statutActuel = e.target.dataset.statut;
            const nouveauStatut = statutActuel === "cloture" ? "actif" : "cloture";
            try {
              await apiFetch(`/api/dossiers/${id}`, { method: "PATCH", body: { statut: nouveauStatut } });
              window.location.reload();
            } catch (err) {
              alert(err.message);
            }
          });
        }

        const actionsEl = document.getElementById("actions-list");
        if (dossier.actions.length === 0) {
          actionsEl.innerHTML = '<p class="muted">Aucune action enregistrée pour ce dossier.</p>';
          return;
        }

        actionsEl.innerHTML = dossier.actions.map(renderAction).join("");
        actionsEl.querySelectorAll("[data-accordion-toggle]").forEach((header) => {
          header.addEventListener("click", () => {
            header.closest(".accordion-item").classList.toggle("open");
          });
        });
        actionsEl.querySelectorAll("[data-valider]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            validerAction(btn.dataset.valider);
          });
        });

        actionsEl.querySelectorAll("[data-toggle-remarque]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            actionsEl.querySelector(`[data-remarque-form="${btn.dataset.toggleRemarque}"]`).hidden = false;
            btn.hidden = true;
          });
        });
        actionsEl.querySelectorAll("[data-remarque-textarea]").forEach((textarea) => {
          textarea.addEventListener("click", (e) => e.stopPropagation());
        });
        actionsEl.querySelectorAll("[data-cancel-remarque]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const id = btn.dataset.cancelRemarque;
            actionsEl.querySelector(`[data-remarque-form="${id}"]`).hidden = true;
            actionsEl.querySelector(`[data-toggle-remarque="${id}"]`).hidden = false;
          });
        });
        actionsEl.querySelectorAll("[data-save-remarque]").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const id = btn.dataset.saveRemarque;
            const textarea = actionsEl.querySelector(`[data-remarque-textarea="${id}"]`);
            const errorEl = actionsEl.querySelector(`[data-remarque-error="${id}"]`);
            errorEl.textContent = "";
            errorEl.classList.remove("visible");
            try {
              await apiFetch(`/api/actions/${id}/commentaires`, {
                method: "POST",
                body: { contenu: textarea.value },
              });
              window.location.reload();
            } catch (err) {
              errorEl.textContent = err.message;
              errorEl.classList.add("visible");
            }
          });
        });
        actionsEl.querySelectorAll("[data-resoudre-remarque]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            resoudreRemarque(btn.dataset.resoudreRemarque, btn.dataset.commentaireId);
          });
        });
        actionsEl.querySelectorAll("[data-renvoyer-validation]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            renvoyerValidation(btn.dataset.renvoyerValidation);
          });
        });

        function ouvrirPanneauEdition(id) {
          const action = dossier.actions.find((a) => a.id === id);
          const contentView = actionsEl.querySelector(`[data-content-view="${id}"]`);
          const editPanel = actionsEl.querySelector(`[data-edit-panel="${id}"]`);
          const textarea = actionsEl.querySelector(`[data-edit-textarea="${id}"]`);
          const preview = actionsEl.querySelector(`[data-preview="${id}"]`);
          contentView.hidden = true;
          editPanel.hidden = false;
          textarea.value = action.contenuGenere || "";
          preview.innerHTML = renderMarkdown(textarea.value);
        }

        // Verrou deja detenu (rendu cote serveur) : reouvre simplement le
        // panneau, sans nouvel appel reseau.
        actionsEl.querySelectorAll("[data-toggle-edit]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            ouvrirPanneauEdition(btn.dataset.toggleEdit);
          });
        });

        // Verrou libre : le prend (POST /verrou) avant d'ouvrir le panneau -
        // 409 avec message clair si quelqu'un d'autre l'a pris entre-temps.
        actionsEl.querySelectorAll("[data-ouvrir-edition]").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const id = btn.dataset.ouvrirEdition;
            try {
              const verrou = await apiFetch(`/api/actions/${id}/verrou`, { method: "POST" });
              const action = dossier.actions.find((a) => a.id === id);
              action.verrouillePar = verrou.verrouillePar;
              action.verrouilleLe = verrou.verrouilleLe;
              ouvrirPanneauEdition(id);
            } catch (err) {
              alert(err.message);
            }
          });
        });

        actionsEl.querySelectorAll("[data-terminer-edition]").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            try {
              await apiFetch(`/api/actions/${btn.dataset.terminerEdition}/verrou`, { method: "DELETE" });
              window.location.reload();
            } catch (err) {
              alert(err.message);
            }
          });
        });

        actionsEl.querySelectorAll("[data-toggle-version-apercu]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const el = actionsEl.querySelector(`[data-version-apercu="${btn.dataset.toggleVersionApercu}"]`);
            el.hidden = !el.hidden;
          });
        });

        actionsEl.querySelectorAll("[data-valider-version]").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            try {
              await apiFetch(
                `/api/actions/${btn.dataset.validerVersion}/versions/${btn.dataset.versionId}/valider`,
                { method: "POST" }
              );
              window.location.reload();
            } catch (err) {
              alert(err.message);
            }
          });
        });

        actionsEl.querySelectorAll("[data-edit-textarea]").forEach((textarea) => {
          textarea.addEventListener("click", (e) => e.stopPropagation());
          textarea.addEventListener("input", () => {
            const id = textarea.dataset.editTextarea;
            const preview = actionsEl.querySelector(`[data-preview="${id}"]`);
            preview.innerHTML = renderMarkdown(textarea.value);
          });
        });

        actionsEl.querySelectorAll("[data-md-cmd]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const toolbar = btn.closest("[data-md-toolbar]");
            const id = toolbar.dataset.mdToolbar;
            const textarea = actionsEl.querySelector(`[data-edit-textarea="${id}"]`);
            applyMarkdownCommand(textarea, btn.dataset.mdCmd);
          });
        });

        actionsEl.querySelectorAll("[data-cancel-edit]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const id = btn.dataset.cancelEdit;
            actionsEl.querySelector(`[data-content-view="${id}"]`).hidden = false;
            actionsEl.querySelector(`[data-edit-panel="${id}"]`).hidden = true;
          });
        });

        // Lot 11 (Partie A) : "Enregistrer" cree desormais une nouvelle
        // ActionVersion (historique) plutot que d'ecrire directement
        // Action.contenuGenere, qui ne change qu'a la validation explicite
        // d'une version (voir README-LOT11.md) - d'ou le rechargement de la
        // page pour refleter a la fois le nouvel historique et l'etat du
        // verrou, plutot qu'une mise a jour locale de l'aperçu.
        actionsEl.querySelectorAll("[data-save-edit]").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const id = btn.dataset.saveEdit;
            const textarea = actionsEl.querySelector(`[data-edit-textarea="${id}"]`);
            const errorEl = actionsEl.querySelector(`[data-edit-error="${id}"]`);
            errorEl.textContent = "";
            errorEl.classList.remove("visible");
            try {
              await apiFetch(`/api/actions/${id}/versions`, {
                method: "POST",
                body: { contenu: textarea.value },
              });
              window.location.reload();
            } catch (err) {
              errorEl.textContent = err.message;
              errorEl.classList.add("visible");
            }
          });
        });
        actionsEl.querySelectorAll("[data-envoyer-form]").forEach((form) => {
          form.addEventListener("click", (e) => e.stopPropagation());
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            envoyerAction(
              form.dataset.envoyerForm,
              fd.get("email"),
              fd.get("avecSignature") === "on",
              fd.get("positionSignature") || "END"
            );
          });
        });

        dossier.actions.forEach((a) => {
          const checkbox = document.getElementById(`avecSignatureDL-${a.id}`);
          const select = document.getElementById(`positionSignatureDL-${a.id}`);
          const enteteCheckbox = document.getElementById(`avecEnteteDL-${a.id}`);

          const update = () =>
            updateDownloadLinks(
              a.id,
              checkbox ? checkbox.checked : false,
              select ? select.value : "END",
              enteteCheckbox ? enteteCheckbox.checked : false
            );

          if (checkbox && select) {
            checkbox.addEventListener("click", (e) => e.stopPropagation());
            select.addEventListener("click", (e) => e.stopPropagation());
            checkbox.addEventListener("change", update);
            select.addEventListener("change", update);
          }
          if (enteteCheckbox) {
            enteteCheckbox.addEventListener("click", (e) => e.stopPropagation());
            enteteCheckbox.addEventListener("change", update);
          }
          // L'en-tête est cochée par défaut (si le cabinet en a une) : on
          // applique tout de suite ce réglage initial aux liens de
          // téléchargement, sans attendre un changement manuel.
          update();
          bindDownloadLink(document.getElementById(`word-link-${a.id}`), "document.docx");
          bindDownloadLink(document.getElementById(`pdf-link-${a.id}`), "document.pdf");

          const emailInput = document.getElementById(`email-${a.id}`);
          const envoyerMoiBtn = actionsEl.querySelector(`[data-envoyer-moi="${a.id}"]`);
          if (envoyerMoiBtn && emailInput) {
            envoyerMoiBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              emailInput.value = me.email;
            });
          }

          [
            `[data-envoyer-client="${a.id}"]`,
            `[data-envoyer-collegue="${a.id}"]`,
            `[data-envoyer-huissier="${a.id}"]`,
          ].forEach((selector) => {
            const select = actionsEl.querySelector(selector);
            if (!select || !emailInput) return;
            select.addEventListener("click", (e) => e.stopPropagation());
            select.addEventListener("change", () => {
              if (select.value) emailInput.value = select.value;
            });
          });
        });
      } catch (err) {
        contentEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    })();

    const STATUT_LABELS = {
      brouillon: "Génération en cours…",
      en_attente_validation: "Prêt — à valider",
      valide: "Validé",
      envoye: "Envoyé au client",
      echec_generation: "Échec de la génération",
      revision_demandee: "Révision demandée",
    };

    // Le seul vrai etat d'echec est "echec_generation" (voir Lot 5 :
    // jeton orphelin de pseudonymisation ou anomalie equivalente detectee
    // apres reponse du LLM - README-LOT5.md, actionsCallback.ts). Ancien
    // comportement fautif corrige au Lot 8bis : un delai ecoule depuis la
    // creation (Date.now() - createdAt > 3 min) etait auparavant utilise
    // comme heuristique de "generation probablement echouee" pour le statut
    // "brouillon" - ce message s'affichait donc a tort sur TOUS les
    // documents generes avec succes des qu'ils depassaient 3 minutes.
    const GENERATION_ECHEC_MESSAGE =
      "La génération de ce document a échoué. Aucun contenu n'a été produit — relancez la génération depuis « Nouvelle action ». Si l'erreur persiste, contactez le support.";

    const STATUT_TAG_LABELS = {
      a_jour: "à jour",
      echeance_proche: "échéance proche",
      cloture: "clôturé",
    };

    // Lot 15 - onglet "Pièces" : liste + upload par glisser-déposer +
    // aperçu inline (PDF/images) + téléchargement/suppression. Le fichier
    // est lu côté navigateur (FileReader -> Data URL base64) et envoyé en
    // JSON, même mécanisme déjà utilisé dans l'app pour l'en-tête/la
    // signature (public/parametres.html, profil.html) - pas de nouvelle
    // dépendance d'upload (multer) ajoutée pour ça, voir README-LOT15.md.
    const TYPE_ICONES_PIECES = {
      "application/pdf": "📄",
      "application/msword": "📝",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document": "📝",
      "text/plain": "📃",
    };

    function iconePiece(typeMime) {
      if (typeMime.startsWith("image/")) return "🖼️";
      return TYPE_ICONES_PIECES[typeMime] || "📎";
    }

    function formatTaille(octets) {
      if (octets < 1024) return `${octets} o`;
      if (octets < 1024 * 1024) return `${(octets / 1024).toFixed(1)} Ko`;
      return `${(octets / (1024 * 1024)).toFixed(1)} Mo`;
    }

    // Lot 17 - reconnaissance de texte (OCR) des pieces. Seuil d'avertissement
    // "relecture manuelle recommandee" - doit rester coherent avec le
    // commentaire equivalent cote serveur (services/ocr/moteurTesseract.ts
    // n'impose pas de seuil, l'affichage seul le fait, volontairement ici
    // uniquement pour rester ajustable sans redeploiement backend).
    const OCR_SEUIL_CONFIANCE_AVERTISSEMENT = 70;
    const OCR_STATUT_LABELS = {
      en_attente: "OCR : en attente",
      en_cours: "OCR : reconnaissance en cours…",
      termine: "Texte reconnu disponible",
      echec: "OCR : échec",
    };

    function badgeOcr(document) {
      if (!document.ocrResultat) return "";
      const label = OCR_STATUT_LABELS[document.ocrResultat.statut] || document.ocrResultat.statut;
      return `<span class="badge badge-ocr-${document.ocrResultat.statut}">${label}</span>`;
    }

    function boutonsOcr(document) {
      if (!document.ocrResultat) return "";
      const boutons = [];
      if (document.ocrResultat.statut === "termine") {
        boutons.push(`<button type="button" class="ghost btn-sm" data-ocr-voir="${document.id}">Voir le texte reconnu</button>`);
      }
      if (document.ocrResultat.statut === "termine" || document.ocrResultat.statut === "echec") {
        boutons.push(`<button type="button" class="ghost btn-sm" data-ocr-relancer="${document.id}">Relancer la reconnaissance</button>`);
      }
      return boutons.join("");
    }

    let piecesDossierCourant = [];
    let piecesDossierId = null;
    let ocrModalDocumentId = null;

    async function loadPiecesDossier(dossierId) {
      const section = document.getElementById("pieces-section");
      if (!section) return;
      piecesDossierId = dossierId;

      section.innerHTML = `
        <div class="card">
          <h2 style="margin-top:0;">Pièces</h2>
          <div id="pieces-dropzone" class="pieces-dropzone">
            Glisse un fichier ici, ou <label class="pieces-file-label">clique pour en choisir un<input type="file" id="pieces-file-input" hidden /></label>
            <p class="muted" style="margin:4px 0 0;">PDF, images, Word, texte — 20 Mo max par fichier.</p>
          </div>
          <p class="error" id="pieces-upload-error"></p>
          <input type="search" id="pieces-recherche-input" placeholder="🔎 Rechercher dans le texte reconnu des pièces…" style="margin-top:12px;" autocomplete="off" />
          <div id="pieces-recherche-resultats" style="display:none; margin-top:8px;"></div>
          <div id="pieces-list" style="margin-top:12px;"><p class="muted">Chargement…</p></div>
        </div>
        <div class="modal-overlay" id="ocr-modal" hidden>
          <div class="modal-box" style="max-width:640px;">
            <h2>Texte reconnu</h2>
            <p class="muted" id="ocr-modal-meta"></p>
            <p class="error visible" id="ocr-modal-warning" style="display:none;"></p>
            <p class="error visible" id="ocr-modal-error" style="display:none;"></p>
            <textarea id="ocr-modal-texte" readonly style="width:100%; min-height:320px; font-family:inherit; resize:vertical;"></textarea>
            <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
              <button type="button" class="ghost" id="ocr-modal-pdf">Télécharger PDF</button>
              <button type="button" class="ghost" id="ocr-modal-word">Télécharger Word</button>
              <button type="button" class="ghost" id="ocr-modal-copier">Copier vers un document en rédaction libre</button>
              <button type="button" class="secondary" id="ocr-modal-fermer">Fermer</button>
            </div>
          </div>
        </div>`;

      wirePiecesUpload();
      wirePiecesOcr();
      await rafraichirPiecesListe();
    }

    // Lot 17 : tant qu'au moins une piece est encore en_attente/en_cours,
    // rafraichirPiecesListe se replanifie elle-meme dans quelques secondes -
    // la duree reelle d'un traitement OCR varie fortement (image simple:
    // quelques secondes ; PDF multi-pages: potentiellement plus d'une
    // minute), donc jamais un delai fixe unique. Un seul minuteur actif a la
    // fois (jamais plusieurs chaines qui s'accumulent si upload/relance sont
    // declenches coup sur coup).
    let piecesOcrPollTimeoutId = null;

    async function rafraichirPiecesListe() {
      const listEl = document.getElementById("pieces-list");
      if (!listEl) return;
      try {
        piecesDossierCourant = await apiFetch(`/api/dossiers/${piecesDossierId}/documents`);
      } catch (err) {
        listEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
        return;
      }

      if (piecesOcrPollTimeoutId) {
        clearTimeout(piecesOcrPollTimeoutId);
        piecesOcrPollTimeoutId = null;
      }
      const ocrEnCours = piecesDossierCourant.some(
        (d) => d.ocrResultat && (d.ocrResultat.statut === "en_attente" || d.ocrResultat.statut === "en_cours")
      );
      if (ocrEnCours) {
        piecesOcrPollTimeoutId = setTimeout(() => {
          piecesOcrPollTimeoutId = null;
          if (piecesDossierId) rafraichirPiecesListe();
        }, 4000);
      }

      if (piecesDossierCourant.length === 0) {
        listEl.innerHTML = '<p class="muted">Aucune pièce déposée pour l\'instant.</p>';
        return;
      }

      listEl.innerHTML = piecesDossierCourant
        .map((d) => {
          const apercuPossible = d.typeMime === "application/pdf" || d.typeMime.startsWith("image/");
          const peutSupprimer = d.uploadePar.id === me.id || me.role === "titulaire" || me.role === "avocat";
          return `
          <div class="action-item">
            <span class="tag">${iconePiece(d.typeMime)} ${escapeHtml(d.nomOriginal)}</span>
            ${badgeOcr(d)}
            <div class="muted">${formatTaille(d.tailleOctets)} — ajouté par ${escapeHtml(d.uploadePar.nom)} le ${new Date(d.createdAt).toLocaleString("fr-FR")}</div>
            <div style="margin-top:6px; display:flex; gap:8px; flex-wrap:wrap;">
              ${apercuPossible ? `<button type="button" class="ghost btn-sm" data-piece-apercu="${d.id}" data-piece-type="${d.typeMime}">Aperçu</button>` : ""}
              <button type="button" class="ghost btn-sm" data-piece-telecharger="${d.id}" data-piece-nom="${escapeHtml(d.nomOriginal)}">Télécharger</button>
              ${boutonsOcr(d)}
              ${peutSupprimer ? `<button type="button" class="ghost btn-sm" data-piece-supprimer="${d.id}">Supprimer</button>` : ""}
            </div>
            <div id="piece-preview-${d.id}" hidden style="margin-top:8px;"></div>
          </div>`;
        })
        .join("");

      listEl.querySelectorAll("[data-ocr-voir]").forEach((btn) => {
        btn.addEventListener("click", () => ouvrirModaleOcr(btn.dataset.ocrVoir));
      });
      listEl.querySelectorAll("[data-ocr-relancer]").forEach((btn) => {
        btn.addEventListener("click", () => relancerOcrPiece(btn.dataset.ocrRelancer));
      });
      listEl.querySelectorAll("[data-piece-apercu]").forEach((btn) => {
        btn.addEventListener("click", () => apercevoirPiece(btn.dataset.pieceApercu, btn.dataset.pieceType));
      });
      listEl.querySelectorAll("[data-piece-telecharger]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await downloadFile(`/api/documents/${btn.dataset.pieceTelecharger}`, btn.dataset.pieceNom);
          } catch (err) {
            alert(err.message);
          }
        });
      });
      listEl.querySelectorAll("[data-piece-supprimer]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Supprimer définitivement cette pièce ?")) return;
          try {
            await apiFetch(`/api/documents/${btn.dataset.pieceSupprimer}`, { method: "DELETE" });
            await rafraichirPiecesListe();
          } catch (err) {
            alert(err.message);
          }
        });
      });
    }

    // Apercu inline (jamais window.open/target="_blank" - sans effet dans
    // la webview desktop Tauri, voir le commentaire detaille dans
    // js/api.js) : fetch + blob + <img>/<iframe> directement dans la page,
    // meme mecanisme que le telechargement (downloadFile) sans declencher
    // la boite de dialogue "Enregistrer".
    async function apercevoirPiece(id, typeMime) {
      const previewEl = document.getElementById(`piece-preview-${id}`);
      if (!previewEl) return;
      if (!previewEl.hidden) {
        previewEl.hidden = true;
        previewEl.innerHTML = "";
        return;
      }
      try {
        const response = await fetch(`/api/documents/${id}?inline=1`, { credentials: "include" });
        if (!response.ok) throw new Error("Aperçu indisponible.");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        previewEl.innerHTML = typeMime.startsWith("image/")
          ? `<img src="${url}" style="max-width:100%; border-radius:8px;" />`
          : `<iframe src="${url}" style="width:100%; height:500px; border:1px solid var(--border); border-radius:8px;"></iframe>`;
        previewEl.hidden = false;
      } catch (err) {
        alert(err.message);
      }
    }

    function wirePiecesUpload() {
      const dropzone = document.getElementById("pieces-dropzone");
      const fileInput = document.getElementById("pieces-file-input");
      if (!dropzone || !fileInput) return;

      fileInput.addEventListener("change", () => {
        if (fileInput.files[0]) uploadPiece(fileInput.files[0]);
        fileInput.value = "";
      });

      dropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("pieces-dropzone-active");
      });
      dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("pieces-dropzone-active");
      });
      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("pieces-dropzone-active");
        const fichier = e.dataTransfer.files[0];
        if (fichier) uploadPiece(fichier);
      });
    }

    function uploadPiece(fichier) {
      const errorEl = document.getElementById("pieces-upload-error");
      errorEl.textContent = "";
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          await apiFetch(`/api/dossiers/${piecesDossierId}/documents`, {
            method: "POST",
            body: { nom: fichier.name, fichierDataUrl: reader.result },
          });
          // Le traitement OCR (s'il est declenche) se termine en tache de
          // fond - rafraichirPiecesListe() se replanifie elle-meme tant que
          // le statut reste en_attente/en_cours (voir sa definition), pas
          // besoin d'un minuteur separe ici.
          await rafraichirPiecesListe();
        } catch (err) {
          errorEl.textContent = err.message;
        }
      };
      reader.onerror = () => {
        errorEl.textContent = "Impossible de lire ce fichier.";
      };
      reader.readAsDataURL(fichier);
    }

    // Lot 17 - recherche plein texte (OCR) + modale de detail. wirePiecesOcr
    // est appelee une seule fois par chargement de l'onglet (voir
    // loadPiecesDossier) : les elements qu'elle cable (modale, barre de
    // recherche) sont statiques dans le gabarit, contrairement a la liste
    // des pieces qui est reconstruite a chaque rafraichirPiecesListe().
    function wirePiecesOcr() {
      const modal = document.getElementById("ocr-modal");
      const fermerBtn = document.getElementById("ocr-modal-fermer");
      const copierBtn = document.getElementById("ocr-modal-copier");
      if (fermerBtn) fermerBtn.addEventListener("click", fermerModaleOcr);
      if (modal) {
        modal.addEventListener("click", (e) => {
          if (e.target === modal) fermerModaleOcr();
        });
      }
      if (copierBtn) {
        copierBtn.addEventListener("click", () => {
          const texte = document.getElementById("ocr-modal-texte").value;
          if (!texte || !ocrModalDocumentId) return;
          // Point de depart editable, jamais une creation automatique :
          // stocke le texte puis redirige vers "Nouvelle action", ou
          // l'utilisateur choisit lui-meme le type de document, le
          // dossier/client, et valide explicitement la creation (voir
          // nouvelle-action.html).
          sessionStorage.setItem("aurore_ocr_copie_redaction_libre", JSON.stringify({ texte }));
          window.location.href = "/nouvelle-action.html";
        });
      }

      const pdfBtn = document.getElementById("ocr-modal-pdf");
      if (pdfBtn) {
        pdfBtn.addEventListener("click", async () => {
          if (!ocrModalDocumentId) return;
          try {
            await downloadFile(`/api/documents/${ocrModalDocumentId}/ocr/pdf`, "texte-reconnu.pdf");
          } catch (err) {
            alert(err.message);
          }
        });
      }
      const wordBtn = document.getElementById("ocr-modal-word");
      if (wordBtn) {
        wordBtn.addEventListener("click", async () => {
          if (!ocrModalDocumentId) return;
          try {
            await downloadFile(`/api/documents/${ocrModalDocumentId}/ocr/word`, "texte-reconnu.docx");
          } catch (err) {
            alert(err.message);
          }
        });
      }

      const rechercheInput = document.getElementById("pieces-recherche-input");
      if (rechercheInput) {
        let rechercheTimer = null;
        rechercheInput.addEventListener("input", () => {
          clearTimeout(rechercheTimer);
          rechercheTimer = setTimeout(() => rechercherDansPieces(rechercheInput.value), 300);
        });
      }
    }

    async function ouvrirModaleOcr(documentId) {
      const modal = document.getElementById("ocr-modal");
      const metaEl = document.getElementById("ocr-modal-meta");
      const warningEl = document.getElementById("ocr-modal-warning");
      const errorEl = document.getElementById("ocr-modal-error");
      const texteEl = document.getElementById("ocr-modal-texte");
      if (!modal) return;

      ocrModalDocumentId = documentId;
      metaEl.textContent = "Chargement…";
      warningEl.style.display = "none";
      errorEl.style.display = "none";
      texteEl.value = "";
      modal.hidden = false;

      try {
        const resultat = await apiFetch(`/api/documents/${documentId}/ocr`);
        if (resultat.statut !== "termine") {
          metaEl.textContent = "";
          errorEl.textContent = resultat.messageErreur || "Le texte de cette pièce n'est pas encore disponible.";
          errorEl.style.display = "block";
          return;
        }
        const score = typeof resultat.scoreConfiance === "number" ? Math.round(resultat.scoreConfiance) : null;
        metaEl.textContent = score === null ? "Score de confiance indisponible." : `Score de confiance : ${score}%`;
        if (score !== null && score < OCR_SEUIL_CONFIANCE_AVERTISSEMENT) {
          warningEl.textContent = "⚠️ Score de confiance faible — relecture manuelle recommandée avant toute utilisation de ce texte.";
          warningEl.style.display = "block";
        }
        texteEl.value = resultat.texteExtrait || "";
      } catch (err) {
        metaEl.textContent = "";
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    }

    function fermerModaleOcr() {
      const modal = document.getElementById("ocr-modal");
      if (modal) modal.hidden = true;
      ocrModalDocumentId = null;
    }

    async function relancerOcrPiece(documentId) {
      try {
        await apiFetch(`/api/documents/${documentId}/ocr/relancer`, { method: "POST" });
        await rafraichirPiecesListe();
      } catch (err) {
        alert(err.message);
      }
    }

    async function rechercherDansPieces(terme) {
      const resultatsEl = document.getElementById("pieces-recherche-resultats");
      if (!resultatsEl) return;
      const valeur = terme.trim();
      if (valeur.length < 2) {
        resultatsEl.style.display = "none";
        resultatsEl.innerHTML = "";
        return;
      }

      try {
        const correspondances = await apiFetch(
          `/api/dossiers/${piecesDossierId}/documents/recherche-ocr?q=${encodeURIComponent(valeur)}`
        );
        resultatsEl.style.display = "block";
        if (correspondances.length === 0) {
          resultatsEl.innerHTML = '<p class="muted">Aucune pièce ne contient ce terme dans son texte reconnu.</p>';
          return;
        }
        resultatsEl.innerHTML = correspondances
          .map(
            (c) => `
            <div class="action-item">
              <span class="tag">${iconePiece(c.typeMime)} ${escapeHtml(c.nomOriginal)}</span>
              <div class="muted" style="margin-top:4px;">…${escapeHtml(c.extrait)}…</div>
              <button type="button" class="ghost btn-sm" style="margin-top:6px;" data-recherche-voir="${c.documentId}">Voir le texte reconnu</button>
            </div>`
          )
          .join("");
        resultatsEl.querySelectorAll("[data-recherche-voir]").forEach((btn) => {
          btn.addEventListener("click", () => ouvrirModaleOcr(btn.dataset.rechercheVoir));
        });
      } catch (err) {
        resultatsEl.style.display = "block";
        resultatsEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    }

    // Lot 12a : onglet "Agenda du dossier" - tous les Evenement lies (voir
    // GET /api/evenements?dossierId=..., routes/evenements.ts), qu'ils
    // soient generes automatiquement (audience, echeance de procedure) ou
    // crees manuellement (RDV, appel, tache). Chaque ligne renvoie vers la
    // vue calendrier centree sur sa date.
    const AGENDA_TYPE_LABELS = {
      audience: "Audience",
      rdv: "RDV",
      appel: "Appel",
      tache: "Tâche",
      echeance_procedure: "Échéance de procédure",
      autre: "Autre",
    };

    async function loadAgendaDossier(dossierId) {
      const section = document.getElementById("agenda-section");
      if (!section) return;
      let evenements;
      try {
        ({ evenements } = await apiFetch(`/api/evenements?dossierId=${dossierId}`));
      } catch {
        return;
      }
      if (evenements.length === 0) {
        section.innerHTML = `
          <div class="card">
            <h2 style="margin-top:0;">Agenda du dossier</h2>
            <p class="muted">Aucun événement lié à ce dossier pour l'instant.</p>
          </div>`;
        return;
      }
      const tries = [...evenements].sort((a, b) => new Date(a.dateDebut) - new Date(b.dateDebut));
      const lignes = tries
        .map((e) => {
          const date = new Date(e.dateDebut);
          const dateJourIso = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
          return `
          <div class="action-item">
            <span class="tag">${escapeHtml(e.titre)}</span>
            <span class="badge badge-evenement-${e.type}">${AGENDA_TYPE_LABELS[e.type] || e.type}</span>
            <div>${e.touteLaJournee ? formatDateLongue(date) : `${formatDateLongue(date)} à ${date.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`}${e.lieu ? " — " + escapeHtml(e.lieu) : ""}</div>
            ${e.description ? `<p class="muted">${escapeHtml(e.description)}</p>` : ""}
            <a class="secondary" href="/calendrier.html?date=${dateJourIso}&vue=jour" style="display:inline-block; text-decoration:none; padding:6px 12px; border-radius:6px; margin-top:6px;">Voir dans le calendrier</a>
          </div>`;
        })
        .join("");
      section.innerHTML = `
        <div class="card">
          <h2 style="margin-top:0;">Agenda du dossier (${evenements.length})</h2>
          ${lignes}
        </div>`;
    }

    // Lot 13 - bloc "Source" distinct du texte d'analyse genere par l'IA :
    // reference exacte, juridiction, date, et lien cliquable TOUJOURS
    // present (une citation sans lien verifie n'atteint jamais ce rendu -
    // elle a deja ete retiree cote serveur, voir services/jurisprudence/grounding.ts).
    function renderSourcesJurisprudence(champsDocument) {
      const sources = champsDocument && champsDocument.sourcesJurisprudence;
      if (!sources || sources.length === 0) return "";
      return `
        <div style="margin-top:10px;">
          <strong>Sources vérifiées (${sources.length})</strong>
          ${sources
            .map(
              (s) => `
            <div class="source-block">
              <div><strong>${escapeHtml(s.reference)}</strong></div>
              <div class="muted">${escapeHtml(s.juridiction || (s.origine === "web" ? "source web" : "juridiction non précisée"))}${s.date ? " — " + escapeHtml(s.date) : ""}</div>
              <a href="${escapeHtml(s.lien)}" target="_blank" rel="noopener">${escapeHtml(s.lien)}</a>
            </div>`
            )
            .join("")}
        </div>`;
    }

    function renderAction(a) {
      const generationEnEchec = a.statut === "echec_generation";
      // Compatibilite avec les documents crees avant le correctif Lot 8bis,
      // restes au statut "brouillon" alors que leur contenu est deja pret
      // (contenuGenere rempli) - traite ici comme equivalent a
      // "en_attente_validation" (badge + bouton de validation) pour ne pas
      // les laisser bloques sans recours.
      const pretAValider =
        a.statut === "en_attente_validation" || (a.statut === "brouillon" && a.contenuGenere);
      const statutLabel = pretAValider ? STATUT_LABELS.en_attente_validation : STATUT_LABELS[a.statut] || a.statut;

      // Lot 11 (Partie A) : verrouillage sequentiel - un document valide/envoye
      // ne peut plus etre rouvert en edition directement (repasser par une
      // remarque de revision, Lot 10) ; sinon, au plus une personne edite a
      // la fois (voir routes/actionVersions.ts).
      const documentFige = a.statut === "valide" || a.statut === "envoye";
      const verrouParMoi = a.verrouillePar && me && a.verrouillePar === me.id;
      const verrouParAutre = a.verrouillePar && !verrouParMoi;
      let verrouZone = "";
      if (documentFige) {
        verrouZone = `<p class="muted" style="margin:6px 0;">Document validé — une remarque de révision (voir Remarques ci-dessous) est nécessaire pour le modifier à nouveau.</p>`;
      } else if (a.contenuGenere) {
        if (verrouParAutre) {
          verrouZone = `<p class="muted" style="margin:6px 0;">🔒 En cours de modification par ${escapeHtml(a.verrouilleParUtilisateur?.nom || "quelqu'un d'autre")} depuis ${a.verrouilleLe ? new Date(a.verrouilleLe).toLocaleString("fr-FR") : ""}.</p>`;
        } else if (verrouParMoi) {
          verrouZone = `<div style="margin:6px 0; display:flex; gap:8px; flex-wrap:wrap;">
              <button type="button" class="ghost btn-sm" data-toggle-edit="${a.id}">Modifier le texte</button>
              <button type="button" class="ghost btn-sm" data-terminer-edition="${a.id}">Terminer l'édition</button>
            </div>`;
        } else {
          verrouZone = `<div style="margin:6px 0;"><button type="button" class="ghost btn-sm" data-ouvrir-edition="${a.id}">Modifier le texte</button></div>`;
        }
      }

      const canUseOwnSignature = me && me.role !== "collaborateur" && me.signatureUrl;
      const canUseResponsableSignature = me && me.role === "collaborateur" && me.peutUtiliserSignatureResponsable;
      const signatureLabel = canUseResponsableSignature
        ? `Insérer la signature de ${escapeHtml(me.responsable?.nom || "mon responsable")}`
        : "Insérer ma signature";
      const hasSignatureOption = canUseOwnSignature || canUseResponsableSignature;

      const signatureCheckbox = hasSignatureOption
        ? `<div style="margin:8px 0 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
             <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:0;">
               <input type="checkbox" name="avecSignature" id="avecSignature-${a.id}" style="width:auto;" /> ${signatureLabel}
             </label>
             <select name="positionSignature" style="width:auto;">
               <option value="START">Alignée à gauche</option>
               <option value="CENTER">Centrée</option>
               <option value="END" selected>Alignée à droite</option>
             </select>
           </div>`
        : "";

      const downloadLinks = a.contenuGenere
        ? `<div style="margin:6px 0;" class="muted">
            <div>
              <a href="#" data-url="/api/actions/${a.id}/word" id="word-link-${a.id}">Télécharger en Word</a> ·
              <a href="#" data-url="/api/actions/${a.id}/pdf" id="pdf-link-${a.id}">Télécharger en PDF</a>
            </div>
            ${
              cabinetHasEntete
                ? `<div style="margin:6px 0 0;">
                     <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:0;">
                       <input type="checkbox" id="avecEnteteDL-${a.id}" style="width:auto;" checked /> Insérer l'en-tête du cabinet
                     </label>
                   </div>`
                : ""
            }
            ${
              hasSignatureOption && !currentDossierEstRecherche
                ? `<div style="margin:6px 0 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                     <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:0;">
                       <input type="checkbox" id="avecSignatureDL-${a.id}" style="width:auto;"${preAvecSignature && a.id === highlightActionId ? " checked" : ""} /> ${signatureLabel} dans le téléchargement
                     </label>
                     <select id="positionSignatureDL-${a.id}" style="width:auto;">
                       <option value="START">Alignée à gauche</option>
                       <option value="CENTER">Centrée</option>
                       <option value="END" selected>Alignée à droite</option>
                     </select>
                   </div>`
                : ""
            }
          </div>`
        : "";

      const estCollaborateur = me && me.role === "collaborateur";
      const envoiConfig = envoiConfigFor(a.typeAction);

      let controls = "";
      if (pretAValider && !currentDossierEstRecherche) {
        const hintEnvoi = envoiConfig
          ? `<p class="muted" style="margin-top:8px;">L'envoi sera possible une fois l'action validée.</p>`
          : "";
        controls = estCollaborateur
          ? `<p class="muted" style="margin-top:8px;">En attente de validation par un avocat du cabinet.</p>`
          : `
          <div style="margin-top:10px;">
            <button type="button" class="secondary" data-valider="${a.id}">Marquer comme validé</button>
          </div>
          ${hintEnvoi}`;
      } else if (envoiConfig && (a.statut === "valide" || (pretAValider && currentDossierEstRecherche))) {
        // Un collaborateur ne peut jamais envoyer un document directement a
        // un client : il ne peut le transmettre qu'a un membre du cabinet
        // (son avocat responsable ou un autre membre), pour relecture/envoi.
        const boutonsEnvoi = [];
        if (envoiConfig.moi) {
          boutonsEnvoi.push(
            `<button type="button" class="secondary" data-envoyer-moi="${a.id}" style="margin:0;">M'envoyer par mail</button>`
          );
        }
        if (envoiConfig.client && !estCollaborateur && clientsAvecEmail.length > 0) {
          boutonsEnvoi.push(
            `<select data-envoyer-client="${a.id}" style="width:auto;">
               <option value="">— Envoyer à un client —</option>
               ${clientsAvecEmail.map((c) => `<option value="${escapeHtml(c.email)}">${escapeHtml(c.nom)}</option>`).join("")}
             </select>`
          );
        }
        if (envoiConfig.collegue && collegues.length > 0) {
          boutonsEnvoi.push(
            `<select data-envoyer-collegue="${a.id}" style="width:auto;">
               <option value="">— Envoyer à un collègue —</option>
               ${collegues.map((u) => `<option value="${escapeHtml(u.email)}">${escapeHtml(u.nom)}</option>`).join("")}
             </select>`
          );
        }
        if (envoiConfig.huissier && huissiersAnnuaire.length > 0) {
          boutonsEnvoi.push(
            `<select data-envoyer-huissier="${a.id}" style="width:auto;">
               <option value="">— Envoyer à l'huissier —</option>
               ${huissiersAnnuaire.map((h) => `<option value="${escapeHtml(h.email)}">${escapeHtml(h.nom)}</option>`).join("")}
             </select>`
          );
        }

        controls = `
          <form data-envoyer-form="${a.id}" style="margin-top:10px;">
            ${boutonsEnvoi.length > 0 ? `<div style="margin:0 0 8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">${boutonsEnvoi.join("")}</div>` : ""}
            ${estCollaborateur ? '<p class="muted" style="margin:0 0 6px;">Tu ne peux envoyer ce document qu\'à un membre du cabinet (pas directement à un client).</p>' : ""}
            <div style="display:flex; gap:8px; align-items:flex-end;">
              <div style="flex:1;">
                <label style="margin:0 0 4px;">Envoyer à (email)</label>
                <input type="email" name="email" id="email-${a.id}" placeholder="${estCollaborateur ? "choisis un destinataire ci-dessus" : "adresse@example.com"}" required ${estCollaborateur ? "readonly" : ""} />
              </div>
              <button type="submit">Envoyer</button>
            </div>
            ${signatureCheckbox}
          </form>`;
      } else if (a.statut === "envoye") {
        controls = `<p class="muted" style="margin-top:8px;">Envoyé à ${escapeHtml(a.destinataireEmail || "")} le ${a.envoyeAt ? new Date(a.envoyeAt).toLocaleString("fr-FR") : ""}</p>`;
      } else if (!envoiConfig && a.statut === "valide") {
        controls = `<p class="muted" style="margin-top:8px;">Document prêt — ce type de document ne nécessite pas d'envoi par email.</p>`;
      }

      const titreAction = a.nomDocument || TYPE_LABELS[a.typeAction] || a.typeAction;
      return `
        <div class="accordion-item">
          <button type="button" class="accordion-header" data-accordion-toggle>
            <span class="tag">${escapeHtml(titreAction)} <span class="badge badge-action-${a.statut}">${escapeHtml(statutLabel)}</span></span>
            <div><strong>Réalisé par ${escapeHtml(a.creePar.nom)}</strong> — ${new Date(a.createdAt).toLocaleString("fr-FR")}</div>
          </button>
          <div class="accordion-body">
            ${generationEnEchec ? `<p class="error visible" style="margin:6px 0;">${escapeHtml(GENERATION_ECHEC_MESSAGE)}</p>` : ""}
            ${verrouZone}
            ${downloadLinks}
            <div class="md-content" data-content-view="${a.id}">${renderMarkdown(a.contenuGenere || "")}</div>
            ${renderSourcesJurisprudence(a.champsDocument)}
            <div class="edit-panel" data-edit-panel="${a.id}" hidden>
              <strong>Modifier le texte — ${escapeHtml(titreAction)}</strong>
              <div class="edit-panel-columns">
                <div>
                  <div class="md-toolbar" data-md-toolbar="${a.id}">
                    <button type="button" data-md-cmd="bold" title="Gras"><strong>G</strong></button>
                    <button type="button" data-md-cmd="italic" title="Italique"><em>I</em></button>
                    <button type="button" data-md-cmd="h1" title="Titre 1">H1</button>
                    <button type="button" data-md-cmd="h2" title="Titre 2">H2</button>
                    <button type="button" data-md-cmd="h3" title="Titre 3">H3</button>
                    <button type="button" data-md-cmd="bullet" title="Liste à puces">• Liste</button>
                    <span class="md-toolbar-sep"></span>
                    <button type="button" data-md-cmd="align-left" title="Aligner à gauche">Gauche</button>
                    <button type="button" data-md-cmd="align-center" title="Centrer">Centré</button>
                    <button type="button" data-md-cmd="align-right" title="Aligner à droite">Droite</button>
                    <button type="button" data-md-cmd="align-justify" title="Justifier">Justifier</button>
                  </div>
                  <textarea data-edit-textarea="${a.id}">${escapeHtml(a.contenuGenere || "")}</textarea>
                </div>
                <div>
                  <div class="muted" style="margin-bottom:4px;">Aperçu</div>
                  <div class="md-content edit-panel-preview" data-preview="${a.id}"></div>
                </div>
              </div>
              <p class="error" data-edit-error="${a.id}"></p>
              <div class="edit-panel-actions">
                <button type="button" class="btn-sm" data-save-edit="${a.id}">Enregistrer</button>
                <button type="button" class="ghost btn-sm" data-cancel-edit="${a.id}">Annuler</button>
              </div>
            </div>
            ${controls}
            ${renderHistoriqueVersionsPanel(a)}
            ${renderRemarquesPanel(a)}
          </div>
        </div>`;
    }

    // Lot 11 (Partie A) : historique des versions - une ligne par sauvegarde
    // explicite (jamais d'autosave). Le contenu de chaque version est deja
    // disponible cote client (inclus par GET /api/dossiers/:id), donc
    // l'apercu ne necessite aucun appel reseau supplementaire. La validation
    // d'une version fige Action.contenuGenere sur son contenu (voir
    // README-LOT11.md) - jamais un collaborateur.
    function renderHistoriqueVersionsPanel(a) {
      const versions = a.versions || [];
      if (versions.length === 0) return "";

      const estCollaborateur = me && me.role === "collaborateur";
      const lignes = versions
        .map((v) => {
          const badge = v.estVersionValidee ? ' <span class="badge badge-action-valide">Validée</span>' : "";
          const boutonValider =
            !v.estVersionValidee && !estCollaborateur
              ? `<button type="button" class="ghost btn-sm" data-valider-version="${a.id}" data-version-id="${v.id}">Valider cette version</button>`
              : "";
          return `
            <div class="remarque-item ${v.estVersionValidee ? "resolue" : ""}">
              <div class="remarque-meta">Version ${v.numero} — ${escapeHtml(v.auteur.nom)} — ${new Date(v.createdAt).toLocaleString("fr-FR")}${badge}</div>
              <div class="remarque-actions" style="display:flex; gap:8px; flex-wrap:wrap;">
                <button type="button" class="ghost btn-sm" data-toggle-version-apercu="${v.id}">Aperçu</button>
                ${boutonValider}
              </div>
              <div class="md-content" data-version-apercu="${v.id}" hidden style="margin-top:8px; padding:8px; border:1px solid var(--hairline); border-radius:8px;">${renderMarkdown(v.contenu)}</div>
            </div>`;
        })
        .join("");

      return `
        <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--hairline);">
          <strong>Historique des versions (${versions.length})</strong>
          <div style="margin-top:8px;">${lignes}</div>
        </div>`;
    }

    // Lot 10 : panneau "Remarques" (commentaires de revision avocat/titulaire
    // -> collaborateur) - scope V1 : remarques generales sur le document,
    // pas d'ancrage sur un passage de texte precis. Masque pour les
    // recherches/jurisprudence, qui n'ont pas d'etape de validation par un
    // avocat (voir envoiConfig / validationRequise cote backend).
    function renderRemarquesPanel(a) {
      if (currentDossierEstRecherche) return "";

      const pretAValider = a.statut === "en_attente_validation" || (a.statut === "brouillon" && a.contenuGenere);
      const estEnRevision = a.statut === "revision_demandee";
      const commentaires = a.commentaires || [];
      if (!pretAValider && !estEnRevision && commentaires.length === 0) return "";

      const estCollaborateur = me && me.role === "collaborateur";
      const peutAjouter = !estCollaborateur && (pretAValider || estEnRevision);
      const ouverts = commentaires.filter((c) => c.statut === "ouvert");

      const liste =
        commentaires.length === 0
          ? '<p class="muted">Aucune remarque pour l\'instant.</p>'
          : commentaires
              .map((c) => {
                const peutResoudre = c.statut === "ouvert" && me && (me.id === a.createdBy || me.id === c.auteurId);
                const piedRemarque =
                  c.statut === "resolu"
                    ? `<div class="remarque-meta">Résolu par ${escapeHtml(c.resoluPar ? c.resoluPar.nom : "")}${c.dateResolution ? " le " + new Date(c.dateResolution).toLocaleString("fr-FR") : ""}</div>`
                    : peutResoudre
                      ? `<div class="remarque-actions"><button type="button" class="ghost btn-sm" data-resoudre-remarque="${a.id}" data-commentaire-id="${c.id}">Marquer résolu</button></div>`
                      : "";
                return `
                <div class="remarque-item ${c.statut === "resolu" ? "resolue" : ""}">
                  <div class="remarque-meta">${escapeHtml(c.auteur.nom)} — ${new Date(c.dateCreation).toLocaleString("fr-FR")}</div>
                  <p class="remarque-contenu">${escapeHtml(c.contenu)}</p>
                  ${piedRemarque}
                </div>`;
              })
              .join("");

      const formAjout = peutAjouter
        ? `<div style="margin-top:8px;">
            <button type="button" class="ghost btn-sm" data-toggle-remarque="${a.id}">+ Ajouter une remarque</button>
            <div class="edit-panel" data-remarque-form="${a.id}" hidden style="margin-top:8px;">
              <textarea data-remarque-textarea="${a.id}" placeholder="Ta remarque pour le collaborateur…" rows="3"></textarea>
              <p class="error" data-remarque-error="${a.id}"></p>
              <div class="edit-panel-actions">
                <button type="button" class="btn-sm" data-save-remarque="${a.id}">Envoyer</button>
                <button type="button" class="ghost btn-sm" data-cancel-remarque="${a.id}">Annuler</button>
              </div>
            </div>
          </div>`
        : "";

      const renvoyerBtn = estEnRevision
        ? `<div style="margin-top:10px;">
            <button type="button" class="secondary" data-renvoyer-validation="${a.id}" ${ouverts.length > 0 ? "disabled" : ""}>Renvoyer pour validation</button>
            ${ouverts.length > 0 ? `<p class="muted" style="margin-top:4px;">Désactivé tant qu'une remarque reste ouverte.</p>` : ""}
          </div>`
        : "";

      return `
        <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--hairline);">
          <strong>Remarques${ouverts.length > 0 ? ` (${ouverts.length} ouverte${ouverts.length > 1 ? "s" : ""})` : ""}</strong>
          <div style="margin-top:8px;">${liste}</div>
          ${formAjout}
          ${renvoyerBtn}
        </div>`;
    }

    function updateDownloadLinks(actionId, avecSignature, positionSignature, avecEntete) {
      const params = new URLSearchParams();
      if (avecSignature) {
        params.set("avecSignature", "1");
        params.set("positionSignature", positionSignature);
      }
      if (avecEntete) {
        params.set("avecEntete", "1");
      }
      const query = params.toString() ? `?${params.toString()}` : "";
      const wordLink = document.getElementById(`word-link-${actionId}`);
      const pdfLink = document.getElementById(`pdf-link-${actionId}`);
      if (wordLink) wordLink.dataset.url = `/api/actions/${actionId}/word${query}`;
      if (pdfLink) pdfLink.dataset.url = `/api/actions/${actionId}/pdf${query}`;
    }

    // downloadFile() (voir js/api.js) plutot qu'une navigation classique -
    // confirme par un message visible (toast) a CHAQUE telechargement, pas
    // seulement au premier (les liens etaient jusqu'ici de simples <a href>,
    // sans aucune confirmation visuelle apres le premier document genere).
    function bindDownloadLink(linkEl, fallbackFilename) {
      if (!linkEl || linkEl.dataset.downloadBound) return;
      linkEl.dataset.downloadBound = "1";
      linkEl.addEventListener("click", async (event) => {
        event.preventDefault();
        event.stopPropagation();
        const url = linkEl.dataset.url;
        if (!url) return;
        try {
          await downloadFile(url, fallbackFilename);
        } catch (err) {
          alert(err.message);
        }
      });
    }

    async function validerAction(actionId) {
      try {
        await apiFetch(`/api/actions/${actionId}/valider`, { method: "POST" });
        window.location.reload();
      } catch (err) {
        alert(err.message);
      }
    }

    async function resoudreRemarque(actionId, commentaireId) {
      try {
        await apiFetch(`/api/actions/${actionId}/commentaires/${commentaireId}/resoudre`, { method: "PATCH" });
        window.location.reload();
      } catch (err) {
        alert(err.message);
      }
    }

    async function renvoyerValidation(actionId) {
      try {
        await apiFetch(`/api/actions/${actionId}/renvoyer-validation`, { method: "POST" });
        window.location.reload();
      } catch (err) {
        alert(err.message);
      }
    }

    async function envoyerAction(actionId, email, avecSignature, positionSignature) {
      try {
        await apiFetch(`/api/actions/${actionId}/envoyer`, {
          method: "POST",
          body: { email, avecSignature, positionSignature },
        });
        showToastAfterReload("Email envoyé.");
        window.location.reload();
      } catch (err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
