<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Dossier</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <p><a href="/dashboard.html" id="back-link">&larr; Retour aux dossiers</a></p>
    <div id="content"><p class="muted">Chargement…</p></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    const TYPE_LABELS = {
      notes: "Compte-rendu d'audience",
      redac: "Plaidoirie",
      conclusions: "Conclusions",
      assignation: "Assignation",
      mise_en_demeure: "Mise en demeure",
      jurisprudence: "Recherche de jurisprudence",
      recherche_juridique: "Recherche juridique",
      resume_pdf: "Résumé de jurisprudence",
      veille_juridique: "Veille juridique",
      traduction: "Traduction",
      plainte: "Plainte",
      contrat: "Contrat",
      notification_date: "Notification de date",
      requete: "Requête",
      projet_ordonnance: "Projet d'ordonnance",
      note_plaidoirie: "Note de plaidoirie",
    };

    let me = null;
    let cabinetHasEntete = false;
    let clientsAvecEmail = [];
    let avocatsAnnuaire = [];
    let collaborateursAnnuaire = [];
    let collegues = [];
    let huissiersAnnuaire = [];
    let currentDossierEstRecherche = false;

    // Configuration des boutons d'envoi par type de document : chaque type
    // n'expose que les destinataires qui ont du sens pour lui (ex: une Note
    // de plaidoirie n'est jamais envoyee par email, un huissier ne concerne
    // qu'Assignation/Mise en demeure). Les types absents de cette liste
    // (compte-rendu, plainte, contrat, notification...) gardent le
    // comportement par defaut (client + collegue).
    const ENVOI_CONFIG = {
      redac: { moi: true },
      conclusions: { collegue: true },
      assignation: { huissier: true, collegue: true },
      mise_en_demeure: { huissier: true, collegue: true },
      requete: { moi: true, collegue: true },
      projet_ordonnance: { moi: true, collegue: true },
      resume_pdf: { moi: true, collegue: true },
      jurisprudence: { moi: true, collegue: true },
      recherche_juridique: { moi: true, collegue: true },
      traduction: { moi: true, collegue: true, client: true },
    };
    const DEFAULT_ENVOI_CONFIG = { client: true, collegue: true };
    function envoiConfigFor(typeAction) {
      if (typeAction === "note_plaidoirie") return null;
      return ENVOI_CONFIG[typeAction] || DEFAULT_ENVOI_CONFIG;
    }

    (async () => {
      me = await requireSession();
      if (!me) return;
      initLayout(me);

      try {
        const cabinet = await apiFetch("/api/cabinet");
        cabinetHasEntete = !!cabinet.enteteUrl;
      } catch {
        cabinetHasEntete = false;
      }

      try {
        const clients = await apiFetch("/api/clients");
        clientsAvecEmail = clients.filter((c) => c.email);
      } catch {
        clientsAvecEmail = [];
      }

      try {
        const annuaire = await apiFetch("/api/users/annuaire");
        const autres = annuaire.filter((u) => u.id !== me.id);
        avocatsAnnuaire = autres.filter((u) => u.role === "titulaire" || u.role === "avocat");
        collaborateursAnnuaire = autres.filter((u) => u.role === "collaborateur");
        collegues = avocatsAnnuaire.concat(collaborateursAnnuaire);
      } catch {
        avocatsAnnuaire = [];
        collaborateursAnnuaire = [];
        collegues = [];
      }

      try {
        huissiersAnnuaire = await apiFetch("/api/huissiers");
      } catch {
        huissiersAnnuaire = [];
      }

      const id = new URLSearchParams(window.location.search).get("id");
      const contentEl = document.getElementById("content");
      if (!id) {
        contentEl.innerHTML = '<p class="error visible">Aucun dossier spécifié.</p>';
        return;
      }

      try {
        const dossier = await apiFetch(`/api/dossiers/${id}`);
        currentDossierEstRecherche = !!dossier.estRecherche;

        document.getElementById("back-link").textContent = currentDossierEstRecherche
          ? "← Retour aux recherches"
          : "← Retour aux dossiers";

        contentEl.innerHTML = `
          <div class="card">
            <span class="badge badge-${dossier.statutTag}">${STATUT_TAG_LABELS[dossier.statutTag] || dossier.statutTag}</span>
            <h1>${escapeHtml(dossier.numeroDossier)} — ${escapeHtml(dossier.nomAffaire)}</h1>
            <p class="muted">Client : ${escapeHtml(dossier.nomClient)} · Juridiction : ${escapeHtml(dossier.nomJuridiction || "non précisée")}${dossier.nomChambre ? " (" + escapeHtml(dossier.nomChambre) + ")" : ""} · créé par ${escapeHtml(dossier.creePar.nom)}</p>
            ${dossier.archivedAt ? `<p class="muted">Archivé automatiquement le ${formatDateLongue(dossier.archivedAt)} — toujours consultable, réactivable via "Rouvrir le dossier".</p>` : ""}
            ${
              currentDossierEstRecherche
                ? ""
                : `${
                    me.role !== "collaborateur"
                      ? `<button type="button" class="secondary" id="toggle-cloture-btn" data-statut="${dossier.statut}">
                          ${dossier.statut === "cloture" ? "Rouvrir le dossier" : "Clôturer le dossier"}
                        </button>`
                      : ""
                  }
                  ${
                    me.role === "titulaire" || me.role === "avocat"
                      ? `<a class="secondary" href="/factures.html?dossierId=${dossier.id}" style="display:inline-block; text-decoration:none; padding:6px 12px; border-radius:6px; margin-left:8px;">Facturer ce dossier</a>`
                      : ""
                  }`
            }
          </div>
          <h2>Historique (${dossier.actions.length})</h2>
          <div id="actions-list"></div>
        `;

        const clotureBtn = document.getElementById("toggle-cloture-btn");
        if (clotureBtn) {
          clotureBtn.addEventListener("click", async (e) => {
            const statutActuel = e.target.dataset.statut;
            const nouveauStatut = statutActuel === "cloture" ? "actif" : "cloture";
            try {
              await apiFetch(`/api/dossiers/${id}`, { method: "PATCH", body: { statut: nouveauStatut } });
              window.location.reload();
            } catch (err) {
              alert(err.message);
            }
          });
        }

        const actionsEl = document.getElementById("actions-list");
        if (dossier.actions.length === 0) {
          actionsEl.innerHTML = '<p class="muted">Aucune action enregistrée pour ce dossier.</p>';
          return;
        }

        actionsEl.innerHTML = dossier.actions.map(renderAction).join("");
        actionsEl.querySelectorAll("[data-accordion-toggle]").forEach((header) => {
          header.addEventListener("click", () => {
            header.closest(".accordion-item").classList.toggle("open");
          });
        });
        actionsEl.querySelectorAll("[data-valider]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            validerAction(btn.dataset.valider);
          });
        });
        actionsEl.querySelectorAll("[data-envoyer-form]").forEach((form) => {
          form.addEventListener("click", (e) => e.stopPropagation());
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            envoyerAction(
              form.dataset.envoyerForm,
              fd.get("email"),
              fd.get("avecSignature") === "on",
              fd.get("positionSignature") || "END"
            );
          });
        });

        dossier.actions.forEach((a) => {
          const checkbox = document.getElementById(`avecSignatureDL-${a.id}`);
          const select = document.getElementById(`positionSignatureDL-${a.id}`);
          const enteteCheckbox = document.getElementById(`avecEnteteDL-${a.id}`);

          const update = () =>
            updateDownloadLinks(
              a.id,
              checkbox ? checkbox.checked : false,
              select ? select.value : "END",
              enteteCheckbox ? enteteCheckbox.checked : false
            );

          if (checkbox && select) {
            checkbox.addEventListener("click", (e) => e.stopPropagation());
            select.addEventListener("click", (e) => e.stopPropagation());
            checkbox.addEventListener("change", update);
            select.addEventListener("change", update);
          }
          if (enteteCheckbox) {
            enteteCheckbox.addEventListener("click", (e) => e.stopPropagation());
            enteteCheckbox.addEventListener("change", update);
          }
          // L'en-tête est cochée par défaut (si le cabinet en a une) : on
          // applique tout de suite ce réglage initial aux liens de
          // téléchargement, sans attendre un changement manuel.
          update();

          const emailInput = document.getElementById(`email-${a.id}`);
          const envoyerMoiBtn = actionsEl.querySelector(`[data-envoyer-moi="${a.id}"]`);
          if (envoyerMoiBtn && emailInput) {
            envoyerMoiBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              emailInput.value = me.email;
            });
          }

          [
            `[data-envoyer-client="${a.id}"]`,
            `[data-envoyer-collegue="${a.id}"]`,
            `[data-envoyer-huissier="${a.id}"]`,
          ].forEach((selector) => {
            const select = actionsEl.querySelector(selector);
            if (!select || !emailInput) return;
            select.addEventListener("click", (e) => e.stopPropagation());
            select.addEventListener("change", () => {
              if (select.value) emailInput.value = select.value;
            });
          });
        });
      } catch (err) {
        contentEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    })();

    const STATUT_LABELS = {
      brouillon: "Génération en cours…",
      en_attente_validation: "Prêt — à valider",
      valide: "Validé",
      envoye: "Envoyé au client",
    };

    // Au-dela de ce delai sans callback n8n (document Google Docs jamais
    // pret), on considere que la generation a probablement echoue plutot
    // que de laisser "Génération en cours…" indefiniment - le
    // telechargement Word/PDF local reste de toute facon disponible
    // independamment de n8n (voir contenuGenere, deja enregistre a la
    // creation de l'action).
    const GENERATION_TIMEOUT_MS = 3 * 60 * 1000;
    const GENERATION_TIMEOUT_MESSAGE =
      "La génération semble avoir échoué. Patientez et relancez dans 2 minutes. Si l'erreur persiste, contactez le support.";

    const STATUT_TAG_LABELS = {
      a_jour: "à jour",
      echeance_proche: "échéance proche",
      cloture: "clôturé",
    };

    function renderAction(a) {
      const generationEnEchec =
        a.statut === "brouillon" && !a.documentUrl && Date.now() - new Date(a.createdAt).getTime() > GENERATION_TIMEOUT_MS;
      const statutLabel = generationEnEchec ? "Échec probable de la génération" : STATUT_LABELS[a.statut] || a.statut;
      const docLink = a.documentUrl
        ? `<a href="${escapeHtml(a.documentUrl)}" target="_blank" rel="noopener">Ouvrir / modifier le document</a>`
        : "";

      const canUseOwnSignature = me && me.role !== "collaborateur" && me.signatureUrl;
      const canUseResponsableSignature = me && me.role === "collaborateur" && me.peutUtiliserSignatureResponsable;
      const signatureLabel = canUseResponsableSignature
        ? `Insérer la signature de ${escapeHtml(me.responsable?.nom || "mon responsable")}`
        : "Insérer ma signature";
      const hasSignatureOption = canUseOwnSignature || canUseResponsableSignature;

      const signatureCheckbox = hasSignatureOption
        ? `<div style="margin:8px 0 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
             <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:0;">
               <input type="checkbox" name="avecSignature" id="avecSignature-${a.id}" style="width:auto;" /> ${signatureLabel}
             </label>
             <select name="positionSignature" style="width:auto;">
               <option value="START">Alignée à gauche</option>
               <option value="CENTER">Centrée</option>
               <option value="END" selected>Alignée à droite</option>
             </select>
           </div>`
        : "";

      const downloadLinks = a.contenuGenere
        ? `<div style="margin:6px 0;" class="muted">
            <div>
              <a href="/api/actions/${a.id}/word" id="word-link-${a.id}">Télécharger en Word</a> ·
              <a href="/api/actions/${a.id}/pdf" id="pdf-link-${a.id}">Télécharger en PDF</a>
            </div>
            ${
              cabinetHasEntete
                ? `<div style="margin:6px 0 0;">
                     <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:0;">
                       <input type="checkbox" id="avecEnteteDL-${a.id}" style="width:auto;" checked /> Insérer l'en-tête du cabinet
                     </label>
                   </div>`
                : ""
            }
            ${
              hasSignatureOption && !currentDossierEstRecherche
                ? `<div style="margin:6px 0 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                     <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:0;">
                       <input type="checkbox" id="avecSignatureDL-${a.id}" style="width:auto;" /> ${signatureLabel} dans le téléchargement
                     </label>
                     <select id="positionSignatureDL-${a.id}" style="width:auto;">
                       <option value="START">Alignée à gauche</option>
                       <option value="CENTER">Centrée</option>
                       <option value="END" selected>Alignée à droite</option>
                     </select>
                   </div>`
                : ""
            }
          </div>`
        : "";

      const estCollaborateur = me && me.role === "collaborateur";
      const envoiConfig = envoiConfigFor(a.typeAction);

      let controls = "";
      if (a.statut === "en_attente_validation" && !currentDossierEstRecherche) {
        const hintEnvoi = envoiConfig
          ? `<p class="muted" style="margin-top:8px;">L'envoi sera possible une fois l'action validée.</p>`
          : "";
        controls = estCollaborateur
          ? `<p class="muted" style="margin-top:8px;">En attente de validation par un avocat du cabinet.</p>`
          : `
          <div style="margin-top:10px;">
            <button type="button" class="secondary" data-valider="${a.id}">Marquer comme validé</button>
          </div>
          ${hintEnvoi}`;
      } else if (envoiConfig && (a.statut === "valide" || (a.statut === "en_attente_validation" && currentDossierEstRecherche))) {
        // Un collaborateur ne peut jamais envoyer un document directement a
        // un client : il ne peut le transmettre qu'a un membre du cabinet
        // (son avocat responsable ou un autre membre), pour relecture/envoi.
        const boutonsEnvoi = [];
        if (envoiConfig.moi) {
          boutonsEnvoi.push(
            `<button type="button" class="secondary" data-envoyer-moi="${a.id}" style="margin:0;">M'envoyer par mail</button>`
          );
        }
        if (envoiConfig.client && !estCollaborateur && clientsAvecEmail.length > 0) {
          boutonsEnvoi.push(
            `<select data-envoyer-client="${a.id}" style="width:auto;">
               <option value="">— Envoyer à un client —</option>
               ${clientsAvecEmail.map((c) => `<option value="${escapeHtml(c.email)}">${escapeHtml(c.nom)}</option>`).join("")}
             </select>`
          );
        }
        if (envoiConfig.collegue && collegues.length > 0) {
          boutonsEnvoi.push(
            `<select data-envoyer-collegue="${a.id}" style="width:auto;">
               <option value="">— Envoyer à un collègue —</option>
               ${collegues.map((u) => `<option value="${escapeHtml(u.email)}">${escapeHtml(u.nom)}</option>`).join("")}
             </select>`
          );
        }
        if (envoiConfig.huissier && huissiersAnnuaire.length > 0) {
          boutonsEnvoi.push(
            `<select data-envoyer-huissier="${a.id}" style="width:auto;">
               <option value="">— Envoyer à l'huissier —</option>
               ${huissiersAnnuaire.map((h) => `<option value="${escapeHtml(h.email)}">${escapeHtml(h.nom)}</option>`).join("")}
             </select>`
          );
        }

        controls = `
          <form data-envoyer-form="${a.id}" style="margin-top:10px;">
            ${boutonsEnvoi.length > 0 ? `<div style="margin:0 0 8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">${boutonsEnvoi.join("")}</div>` : ""}
            ${estCollaborateur ? '<p class="muted" style="margin:0 0 6px;">Tu ne peux envoyer ce document qu\'à un membre du cabinet (pas directement à un client).</p>' : ""}
            <div style="display:flex; gap:8px; align-items:flex-end;">
              <div style="flex:1;">
                <label style="margin:0 0 4px;">Envoyer à (email)</label>
                <input type="email" name="email" id="email-${a.id}" placeholder="${estCollaborateur ? "choisis un destinataire ci-dessus" : "adresse@example.com"}" required ${estCollaborateur ? "readonly" : ""} />
              </div>
              <button type="submit">Envoyer</button>
            </div>
            ${signatureCheckbox}
          </form>`;
      } else if (a.statut === "envoye") {
        controls = `<p class="muted" style="margin-top:8px;">Envoyé à ${escapeHtml(a.destinataireEmail || "")} le ${a.envoyeAt ? new Date(a.envoyeAt).toLocaleString("fr-FR") : ""}</p>`;
      } else if (!envoiConfig && a.statut === "valide") {
        controls = `<p class="muted" style="margin-top:8px;">Document prêt — ce type de document ne nécessite pas d'envoi par email.</p>`;
      }

      const titreAction = a.nomDocument || TYPE_LABELS[a.typeAction] || a.typeAction;
      return `
        <div class="accordion-item">
          <button type="button" class="accordion-header" data-accordion-toggle>
            <span class="tag">${escapeHtml(titreAction)} · ${escapeHtml(statutLabel)}</span>
            <div><strong>Réalisé par ${escapeHtml(a.creePar.nom)}</strong> — ${new Date(a.createdAt).toLocaleString("fr-FR")}</div>
          </button>
          <div class="accordion-body">
            ${generationEnEchec ? `<p class="error visible" style="margin:6px 0;">${escapeHtml(GENERATION_TIMEOUT_MESSAGE)}</p>` : ""}
            ${docLink ? `<div style="margin:6px 0;">${docLink}</div>` : ""}
            ${downloadLinks}
            <div class="md-content">${renderMarkdown(a.contenuGenere || "")}</div>
            ${controls}
          </div>
        </div>`;
    }

    function updateDownloadLinks(actionId, avecSignature, positionSignature, avecEntete) {
      const params = new URLSearchParams();
      if (avecSignature) {
        params.set("avecSignature", "1");
        params.set("positionSignature", positionSignature);
      }
      if (avecEntete) {
        params.set("avecEntete", "1");
      }
      const query = params.toString() ? `?${params.toString()}` : "";
      const wordLink = document.getElementById(`word-link-${actionId}`);
      const pdfLink = document.getElementById(`pdf-link-${actionId}`);
      if (wordLink) wordLink.href = `/api/actions/${actionId}/word${query}`;
      if (pdfLink) pdfLink.href = `/api/actions/${actionId}/pdf${query}`;
    }

    async function validerAction(actionId) {
      try {
        await apiFetch(`/api/actions/${actionId}/valider`, { method: "POST" });
        window.location.reload();
      } catch (err) {
        alert(err.message);
      }
    }

    async function envoyerAction(actionId, email, avecSignature, positionSignature) {
      try {
        await apiFetch(`/api/actions/${actionId}/envoyer`, {
          method: "POST",
          body: { email, avecSignature, positionSignature },
        });
        window.location.reload();
      } catch (err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
