<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Base de jurisprudence</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <div class="page-hero">
      <div class="eyebrow">Cabinet</div>
      <h1>Base de jurisprudence</h1>
      <p>Ajoute ici des textes de loi et décisions que tu as toi-même vérifiés. Aurore ne citera dans ses recherches de jurisprudence QUE les décisions présentes dans cette base — jamais une référence inventée.</p>
    </div>

    <div id="error" class="error"></div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
        <h2 style="margin:0;">Sources déjà indexées</h2>
        <button type="button" id="toggle-create-btn">+ Ajouter une source</button>
      </div>
      <div id="entries-list"><p class="muted">Chargement…</p></div>
    </div>

    <div class="collapse-panel" id="create-panel">
      <div class="collapse-panel-inner">
        <form id="create-form">
          <label>Source (ex: OHADA, Code béninois, Cour Suprême)</label>
          <input name="source" required />
          <label>Référence exacte (ex: Arrêt n° 12/2024 CCJA du 15/03/2024)</label>
          <input name="reference" required />
          <label>Juridiction</label>
          <input name="juridiction" placeholder="ex: CCJA, Cour d'Appel de Cotonou" />
          <label>Date de la décision</label>
          <input name="dateDecision" type="date" />
          <label>Lien vers la décision (recommandé — une source sans lien n'est jamais citée dans une recherche)</label>
          <input name="lien" type="url" placeholder="https://..." />
          <label>Contenu / résumé (le plus complet possible)</label>
          <textarea name="contenu" required minlength="20" style="min-height:160px;"></textarea>
          <button type="submit">Indexer dans la base</button>
        </form>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    async function loadEntries() {
      const listEl = document.getElementById("entries-list");
      try {
        const entries = await apiFetch("/api/jurisprudence-base");
        if (entries.length === 0) {
          listEl.innerHTML = '<p class="muted">Aucune source indexée pour l\'instant — les recherches de jurisprudence indiqueront qu\'aucune source vérifiée n\'est disponible.</p>';
          return;
        }
        listEl.innerHTML = entries
          .map(
            (e) => `
          <div class="action-item">
            <span class="tag">${escapeHtml(e.source)}${e.juridiction ? " · " + escapeHtml(e.juridiction) : ""}</span>
            <div><strong>${escapeHtml(e.reference)}</strong>${e.dateDecision ? " — " + escapeHtml(e.dateDecision) : ""}</div>
            <pre>${escapeHtml(e.contenu)}</pre>
            ${
              e.lien
                ? `<p class="muted">🔗 <a href="${escapeHtml(e.lien)}" target="_blank" rel="noopener">${escapeHtml(e.lien)}</a></p>`
                : `<p class="error visible" style="margin:6px 0;">Aucun lien renseigné — cette source ne sera jamais citée dans une recherche de jurisprudence (voir README-LOT13.md).</p>
                   <form class="lien-form" data-lien-form="${e.id}" style="display:flex; gap:8px; align-items:flex-end; margin:6px 0;">
                     <div style="flex:1;"><label style="margin:0 0 4px;">Ajouter le lien</label><input name="lien" type="url" placeholder="https://..." required /></div>
                     <button type="submit" class="btn-sm">Enregistrer</button>
                   </form>`
            }
            <button type="button" class="secondary" data-delete="${e.id}">Supprimer</button>
          </div>`
          )
          .join("");
        listEl.querySelectorAll("[data-delete]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("Supprimer cette source de la base ?")) return;
            await apiFetch(`/api/jurisprudence-base/${btn.dataset.delete}`, { method: "DELETE" });
            loadEntries();
          });
        });
        listEl.querySelectorAll("[data-lien-form]").forEach((form) => {
          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            try {
              await apiFetch(`/api/jurisprudence-base/${form.dataset.lienForm}`, {
                method: "PATCH",
                body: { lien: fd.get("lien") },
              });
              loadEntries();
            } catch (err) {
              showError(errorEl, err.message);
            }
          });
        });
      } catch (err) {
        listEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    }

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);
      loadEntries();
    })();

    const createPanel = document.getElementById("create-panel");
    const toggleCreateBtn = document.getElementById("toggle-create-btn");
    toggleCreateBtn.addEventListener("click", () => {
      createPanel.classList.toggle("open");
      toggleCreateBtn.textContent = createPanel.classList.contains("open") ? "Réduire" : "+ Ajouter une source";
    });

    const errorEl = document.getElementById("error");
    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorEl);
      const fd = new FormData(e.target);
      try {
        await apiFetch("/api/jurisprudence-base", {
          method: "POST",
          body: {
            source: fd.get("source"),
            reference: fd.get("reference"),
            juridiction: fd.get("juridiction") || undefined,
            dateDecision: fd.get("dateDecision") || undefined,
            contenu: fd.get("contenu"),
          },
        });
        e.target.reset();
        createPanel.classList.remove("open");
        toggleCreateBtn.textContent = "+ Ajouter une source";
        loadEntries();
      } catch (err) {
        showError(errorEl, err.message);
      }
    });

  </script>
</body>
</html>
