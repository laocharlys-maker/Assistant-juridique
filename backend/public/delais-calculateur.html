<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Calcul de délais</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <div class="page-hero">
      <div class="eyebrow">Procédure</div>
      <h1>Délais</h1>
      <p>Calcul déterministe (pas d'IA) à partir des délais validés par le cabinet.</p>
    </div>

    <div id="error" class="error"></div>
    <div id="empty-warning" class="error" style="display:none;">Aucun délai n'est encore défini dans le référentiel du cabinet. Demande à l'administrateur d'en ajouter via "Gérer les délais".</div>

    <div class="card">
      <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
        <h2 style="margin:0;">Historique des délais</h2>
        <span class="muted" id="history-count"></span>
      </div>
      <div id="history-list"><p class="muted">Chargement…</p></div>
    </div>

    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom: 4px;">
      <button type="button" class="secondary" id="manage-types-link" style="display:none;">Gérer les délais</button>
      <button type="button" id="toggle-calc-btn">+ Calculer un délai</button>
    </div>

    <div class="collapse-panel" id="calc-panel">
      <div class="collapse-panel-inner">
        <form id="calc-form">
          <label>Type de délai</label>
          <select name="delaiTypeId" id="delai-type-select" required></select>
          <label>Date de départ (signification, notification, décision...)</label>
          <input name="dateDepart" type="date" required />
          <label>Dossier concerné (optionnel)</label>
          <select name="dossierId" id="dossier-select">
            <option value="">— aucun —</option>
          </select>
          <label style="display:flex; align-items:center; gap:8px; font-weight:400;">
            <input type="checkbox" name="creerRappelCalendar" style="width:auto;" />
            Créer un rappel dans Google Calendar
          </label>
          <button type="submit">Calculer</button>
        </form>

        <div id="result" style="display:none; margin-top:20px; padding-top:16px; border-top:1px solid var(--hairline);"></div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function formatDate(iso) {
      return formatDateLongue(iso);
    }

    const errorEl = document.getElementById("error");
    const resultEl = document.getElementById("result");
    const typeSelect = document.getElementById("delai-type-select");
    const dossierSelect = document.getElementById("dossier-select");

    async function loadTypes() {
      const types = await apiFetch("/api/delais-types");
      if (types.length === 0) {
        document.getElementById("empty-warning").style.display = "block";
        document.getElementById("calc-form").style.display = "none";
        return;
      }
      typeSelect.innerHTML = types
        .map((t) => `<option value="${t.id}">${escapeHtml(t.nom)} (${t.nombreUnites} ${t.unite})</option>`)
        .join("");
    }

    async function loadDossiers() {
      const { dossiers } = await apiFetch("/api/dossiers");
      dossierSelect.innerHTML =
        '<option value="">— aucun —</option>' +
        dossiers
          .map((d) => `<option value="${d.id}">${escapeHtml(d.numeroDossier)} — ${escapeHtml(d.nomAffaire)}</option>`)
          .join("");
    }

    async function loadHistory() {
      const listEl = document.getElementById("history-list");
      const countEl = document.getElementById("history-count");
      try {
        const calculs = await apiFetch("/api/delais/historique");
        countEl.textContent = calculs.length > 0 ? `${calculs.length} calcul${calculs.length > 1 ? "s" : ""}` : "";
        if (calculs.length === 0) {
          listEl.innerHTML = '<p class="muted">Aucun calcul effectué pour l\'instant.</p>';
          return;
        }
        listEl.innerHTML = calculs
          .map(
            (c) => `
          <div class="action-item">
            <span class="tag">${escapeHtml(c.delaiType.nom)}${c.dossier ? " · " + escapeHtml(c.dossier.numeroDossier) : ""}${c.rappelCalendar ? " · rappel Calendar créé" : ""}</span>
            <div>Départ : ${formatDate(c.dateDepart)} → <strong>Date limite : ${formatDate(c.dateLimite)}</strong></div>
            <p class="muted">Calculé par ${escapeHtml(c.createdBy.nom)} le ${new Date(c.createdAt).toLocaleString("fr-FR")}</p>
          </div>`
          )
          .join("");
      } catch (err) {
        listEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    }

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);
      if (me.role === "titulaire") {
        document.getElementById("manage-types-link").style.display = "inline-block";
      }
      await Promise.all([loadTypes(), loadDossiers(), loadHistory()]);
    })();

    document.getElementById("manage-types-link").addEventListener("click", () => {
      window.location.href = "/delais-types.html";
    });

    const calcPanel = document.getElementById("calc-panel");
    const toggleCalcBtn = document.getElementById("toggle-calc-btn");
    toggleCalcBtn.addEventListener("click", () => {
      calcPanel.classList.toggle("open");
      toggleCalcBtn.textContent = calcPanel.classList.contains("open") ? "Réduire" : "+ Calculer un délai";
    });

    document.getElementById("calc-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorEl);
      resultEl.style.display = "none";
      const fd = new FormData(e.target);
      try {
        const calcul = await apiFetch("/api/delais/calculer", {
          method: "POST",
          body: {
            delaiTypeId: fd.get("delaiTypeId"),
            dateDepart: fd.get("dateDepart"),
            dossierId: fd.get("dossierId") || undefined,
            creerRappelCalendar: fd.get("creerRappelCalendar") === "on",
          },
        });
        resultEl.innerHTML = `
          <h2>Date limite</h2>
          <p style="font-size:1.4em;"><strong>${formatDate(calcul.dateLimite)}</strong></p>
          <p class="muted">${escapeHtml(calcul.delaiType.nom)} — ${escapeHtml(calcul.delaiType.texteReference)}</p>
          ${calcul.rappelCalendar ? '<p class="muted">Rappel créé dans Google Calendar.</p>' : ""}
        `;
        resultEl.style.display = "block";
        loadHistory();
      } catch (err) {
        showError(errorEl, err.message);
      }
    });

  </script>
</body>
</html>
