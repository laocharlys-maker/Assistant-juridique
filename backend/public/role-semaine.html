<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Audiences programmées</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <div class="page-hero">
      <div class="eyebrow">Procédure</div>
      <h1>Audiences programmées</h1>
      <p>Saisis ici les audiences reçues du greffe/tribunal pour préparer à temps — le rôle est en général communiqué environ 10 jours avant la semaine concernée.</p>
    </div>

    <div id="error" class="error"></div>

    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
      <div class="tabs" id="scope-tabs" style="display:none; margin-bottom:0;">
        <button class="tab" data-scope="mine">Mes audiences</button>
        <button class="tab" data-scope="cabinet">Tout le cabinet</button>
      </div>
      <button type="button" class="tab" id="toggle-add-btn">+ Ajouter une audience</button>
    </div>

    <div class="collapse-panel" id="add-panel">
      <div class="collapse-panel-inner">
        <form id="add-form">
          <label>Date et heure de l'audience</label>
          <input name="dateAudience" type="datetime-local" required />
          <label>Juridiction</label>
          <input name="juridiction" required placeholder="ex: CRIET Instance" />
          <label>Chambre (optionnel)</label>
          <input name="chambre" placeholder="ex: Chambre correctionnelle" />
          <label>Numéro de procédure (optionnel)</label>
          <input name="procedureNumero" placeholder="ex: 15/2025" />
          <label>Parties</label>
          <input name="parties" required placeholder="ex: Koffi C/ Kodjo" />
          <label>Qualité procédurale du client (optionnel)</label>
          <select name="qualiteProcedurale">
            <option value="">— Non précisé —</option>
            <option value="Demandeur">Demandeur</option>
            <option value="Défendeur">Défendeur</option>
            <option value="Intervenant volontaire">Intervenant volontaire</option>
            <option value="Intervenant forcé">Intervenant forcé</option>
            <option value="Appelant">Appelant</option>
            <option value="Intimé">Intimé</option>
            <option value="Demandeur au pourvoi">Demandeur au pourvoi</option>
            <option value="Défendeur au pourvoi">Défendeur au pourvoi</option>
          </select>
          <label>Objet de la procédure (optionnel)</label>
          <input name="objetProcedure" />
          <label>Dernier motif (optionnel)</label>
          <input name="dernierMotif" placeholder="ex: DP" />
          <label>Diligences (optionnel)</label>
          <input name="diligences" placeholder="ex: PSV" />
          <label>Dossier lié (optionnel)</label>
          <input name="dossierNumero" list="dossiers-datalist-role" placeholder="Numéro de dossier" />
          <datalist id="dossiers-datalist-role"></datalist>
          <label style="display:flex; align-items:center; gap:8px; font-weight:400;">
            <input type="checkbox" name="creerRappelCalendar" style="width:auto;" />
            Créer un rappel dans Google Calendar
          </label>
          <div style="display:flex; gap:10px; margin-top:18px;">
            <button type="submit">Ajouter au rôle</button>
            <button type="button" class="ghost" id="cancel-add-btn">Annuler</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <button type="button" class="secondary btn-sm" id="prev-month-btn">← Mois précédent</button>
        <strong id="month-label">…</strong>
        <button type="button" class="secondary btn-sm" id="next-month-btn">Mois suivant →</button>
      </div>
    </div>

    <div id="suggestions-content"></div>

    <div id="month-content"><p class="muted">Chargement…</p></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];
    const STATUT_LABELS = { a_preparer: "À préparer", pret: "Prêt", traite: "Traité" };
    const STATUT_BADGE = { a_preparer: "badge-echeance_proche", pret: "badge-envoyee", traite: "badge-a_jour" };

    let currentMonthStart = startOfMonth(new Date());
    let dossiersParNumero = new Map();

    function startOfMonth(date) {
      const d = new Date(date);
      d.setDate(1);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    // Construit la grille du mois (semaines de lundi a vendredi), avec des
    // cases vides (null) pour completer la premiere et la derniere semaine
    // quand le mois ne commence/finit pas un lundi/vendredi.
    function construireSemainesDuMois(monthStart) {
      const annee = monthStart.getFullYear();
      const mois = monthStart.getMonth();
      const dernierJour = new Date(annee, mois + 1, 0).getDate();
      const semaines = [];
      let semaineCourante = [];
      for (let jour = 1; jour <= dernierJour; jour += 1) {
        const date = new Date(annee, mois, jour);
        const idx = date.getDay() - 1; // 0 = lundi ... 4 = vendredi (week-end ignore)
        if (idx < 0 || idx > 4) continue;
        if (semaineCourante.length > 0 && idx === 0) {
          semaines.push(semaineCourante);
          semaineCourante = [];
        }
        while (semaineCourante.length < idx) semaineCourante.push(null);
        semaineCourante.push(date);
      }
      if (semaineCourante.length > 0) {
        while (semaineCourante.length < 5) semaineCourante.push(null);
        semaines.push(semaineCourante);
      }
      return semaines;
    }

    function formatHeure(iso) {
      return new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }
    // Date calendaire locale (YYYY-MM-DD) — a ne jamais remplacer par
    // toISOString().slice(0,10), qui bascule sur le jour UTC et decale la
    // semaine affichee des que le fuseau local n'est pas UTC (ex: Benin,
    // UTC+1 : minuit local le lundi = 23h la veille en UTC).
    function toLocalDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    async function loadDossiersForDatalist() {
      try {
        const { dossiers } = await apiFetch("/api/dossiers");
        const datalist = document.getElementById("dossiers-datalist-role");
        datalist.innerHTML = dossiers
          .map((d) => `<option value="${escapeHtml(d.numeroDossier)}">${escapeHtml(d.nomAffaire)}</option>`)
          .join("");
        dossiers.forEach((d) => dossiersParNumero.set(d.numeroDossier, d));
      } catch {
        // Non bloquant.
      }
    }

    async function loadMonth(scope) {
      const errorEl = document.getElementById("error");
      hideError(errorEl);
      const contentEl = document.getElementById("month-content");
      contentEl.innerHTML = '<p class="muted">Chargement…</p>';
      try {
        const query = scope ? `?scope=${scope}` : "";
        const debutStr = toLocalDateStr(currentMonthStart);
        const sep = query ? "&" : "?";
        const data = await apiFetch(`/api/role-audiences${query}${sep}debut=${debutStr}&periode=mois`);
        document.querySelectorAll("#scope-tabs .tab").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.scope === data.scope);
        });

        document.getElementById("month-label").textContent =
          currentMonthStart.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

        const parJour = new Map();
        data.audiences.forEach((a) => {
          const key = toLocalDateStr(new Date(a.dateAudience));
          if (!parJour.has(key)) parJour.set(key, []);
          parJour.get(key).push(a);
        });

        const semaines = construireSemainesDuMois(currentMonthStart);

        contentEl.innerHTML = `
          <div class="role-month-grid-header">
            ${JOURS.map((j) => `<div class="role-month-col-label">${j}</div>`).join("")}
          </div>
          ${semaines
            .map(
              (semaine) => `
            <div class="role-month-week">
              ${semaine
                .map((jourDate) => {
                  if (!jourDate) return '<div class="role-month-cell role-month-cell-empty"></div>';
                  const audiences = parJour.get(toLocalDateStr(jourDate)) || [];
                  return `
                  <div class="role-month-cell">
                    <div class="role-month-cell-date">${jourDate.getDate()}</div>
                    ${audiences
                      .map(
                        (a) => `
                      <div class="role-month-entry">
                        <div><strong>${formatHeure(a.dateAudience)}</strong> — ${escapeHtml(a.parties)}</div>
                        <div class="meta" style="font-size:0.78rem;">
                          ${escapeHtml(a.juridiction)}${a.chambre ? " · " + escapeHtml(a.chambre) : ""}
                          ${a.dossier ? `<br />Dossier : ${escapeHtml(a.dossier.numeroDossier)}` : ""}
                        </div>
                        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px;">
                          <span class="badge ${STATUT_BADGE[a.statut]}" style="font-size:0.7rem;">${STATUT_LABELS[a.statut]}</span>
                          <select data-statut-select="${a.id}" style="width:auto; margin:0; font-size:0.78rem; padding:4px 8px;">
                            <option value="a_preparer"${a.statut === "a_preparer" ? " selected" : ""}>À préparer</option>
                            <option value="pret"${a.statut === "pret" ? " selected" : ""}>Prêt</option>
                            <option value="traite"${a.statut === "traite" ? " selected" : ""}>Traité</option>
                          </select>
                          <button type="button" class="icon-action is-danger" data-tooltip="Supprimer" data-delete="${a.id}">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                          </button>
                        </div>
                      </div>`
                      )
                      .join("")}
                  </div>`;
                })
                .join("")}
            </div>`
            )
            .join("")}
        `;

        contentEl.querySelectorAll("[data-statut-select]").forEach((sel) => {
          sel.addEventListener("change", async () => {
            try {
              await apiFetch(`/api/role-audiences/${sel.dataset.statutSelect}`, {
                method: "PATCH",
                body: { statut: sel.value },
              });
              loadMonth(scope);
            } catch (err) {
              showError(errorEl, err.message);
            }
          });
        });
        contentEl.querySelectorAll("[data-delete]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("Supprimer cette audience du rôle ?")) return;
            try {
              await apiFetch(`/api/role-audiences/${btn.dataset.delete}`, { method: "DELETE" });
              loadMonth(scope);
            } catch (err) {
              showError(errorEl, err.message);
            }
          });
        });
      } catch (err) {
        showError(errorEl, err.message);
        contentEl.innerHTML = "";
      }
    }

    async function loadSuggestions() {
      const box = document.getElementById("suggestions-content");
      try {
        const debutStr = toLocalDateStr(currentMonthStart);
        const { suggestions } = await apiFetch(`/api/role-audiences/suggestions?debut=${debutStr}&periode=mois`);
        if (suggestions.length === 0) {
          box.innerHTML = "";
          return;
        }
        box.innerHTML = `
          <div class="card">
            <h2 style="margin-bottom:6px;">Suggestions</h2>
            <p class="muted" style="margin-top:0;">Ces dossiers annoncent une prochaine audience ce mois-ci dans leur dernier compte-rendu — vérifie et complète avant d'ajouter au calendrier.</p>
            ${suggestions
              .map(
                (s) => `
              <div class="dossier-item">
                <div>
                  <strong>${escapeHtml(s.dossier.nomAffaire)}</strong>
                  <div class="meta">Dossier ${escapeHtml(s.dossier.numeroDossier)} · ${escapeHtml(s.dossier.nomClient)} · Prochaine audience : ${new Date(s.prochaineAudience).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}${s.piecesPrevoir ? `<br />Pièces à prévoir : ${escapeHtml(s.piecesPrevoir)}` : ""}</div>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                  <button type="button" class="secondary btn-sm" data-suggestion-add='${JSON.stringify({ dossierId: s.dossierId, dossierNumero: s.dossier.numeroDossier, parties: s.dossier.nomAffaire, prochaineAudience: s.prochaineAudience }).replace(/'/g, "&#39;")}'>Ajouter au calendrier</button>
                  <button type="button" class="ghost btn-sm" data-suggestion-ignorer="${s.actionId}">Ne pas ajouter au calendrier</button>
                </div>
              </div>`
              )
              .join("")}
          </div>`;
        box.querySelectorAll("[data-suggestion-add]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const s = JSON.parse(btn.dataset.suggestionAdd);
            addPanel.classList.add("open");
            toggleAddBtn.textContent = "Réduire";
            const form = document.getElementById("add-form");
            const d = new Date(s.prochaineAudience);
            const pad = (n) => String(n).padStart(2, "0");
            form.dateAudience.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            form.dossierNumero.value = s.dossierNumero;
            form.parties.value = s.parties;
            form.parties.focus();
            window.scrollTo({ top: addPanel.offsetTop - 20, behavior: "smooth" });
          });
        });
        box.querySelectorAll("[data-suggestion-ignorer]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            try {
              await apiFetch(`/api/role-audiences/suggestions/${btn.dataset.suggestionIgnorer}/ignorer`, { method: "POST" });
              loadSuggestions();
            } catch (err) {
              showError(document.getElementById("error"), err.message);
            }
          });
        });
      } catch {
        box.innerHTML = "";
      }
    }

    let activeScope;

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);

      if (me.role !== "collaborateur") {
        document.getElementById("scope-tabs").style.display = "flex";
        document.querySelectorAll("#scope-tabs .tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeScope = btn.dataset.scope;
            loadMonth(activeScope);
            loadSuggestions();
          });
        });
      }

      loadDossiersForDatalist();
      loadMonth(activeScope);
      loadSuggestions();

      // Empeche de choisir une date/heure passee directement dans le
      // selecteur natif du navigateur (double garde-fou avec la verification
      // au moment de l'envoi, pour les navigateurs qui l'ignorent).
      const now = new Date();
      now.setSeconds(0, 0);
      const pad = (n) => String(n).padStart(2, "0");
      document.querySelector('#add-form [name="dateAudience"]').min = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
    })();

    document.getElementById("prev-month-btn").addEventListener("click", () => {
      currentMonthStart.setMonth(currentMonthStart.getMonth() - 1);
      loadMonth(activeScope);
      loadSuggestions();
    });
    document.getElementById("next-month-btn").addEventListener("click", () => {
      currentMonthStart.setMonth(currentMonthStart.getMonth() + 1);
      loadMonth(activeScope);
      loadSuggestions();
    });

    const addPanel = document.getElementById("add-panel");
    const toggleAddBtn = document.getElementById("toggle-add-btn");
    toggleAddBtn.addEventListener("click", () => {
      addPanel.classList.toggle("open");
      toggleAddBtn.textContent = addPanel.classList.contains("open") ? "Réduire" : "+ Ajouter une audience";
    });
    document.getElementById("cancel-add-btn").addEventListener("click", () => {
      addPanel.classList.remove("open");
      toggleAddBtn.textContent = "+ Ajouter une audience";
    });

    document.getElementById("add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      hideError(errorEl);
      const fd = new FormData(e.target);
      const dossierNumero = fd.get("dossierNumero");
      const dossier = dossierNumero ? dossiersParNumero.get(dossierNumero.trim()) : undefined;
      const dateAudienceLocale = new Date(fd.get("dateAudience"));
      if (dateAudienceLocale.getTime() < Date.now()) {
        showError(errorEl, "La date de l'audience ne peut pas être dans le passé. Vérifie la date saisie.");
        return;
      }
      try {
        await apiFetch("/api/role-audiences", {
          method: "POST",
          body: {
            dateAudience: dateAudienceLocale.toISOString(),
            juridiction: fd.get("juridiction"),
            chambre: fd.get("chambre") || undefined,
            procedureNumero: fd.get("procedureNumero") || undefined,
            parties: fd.get("parties"),
            qualiteProcedurale: fd.get("qualiteProcedurale") || undefined,
            objetProcedure: fd.get("objetProcedure") || undefined,
            dernierMotif: fd.get("dernierMotif") || undefined,
            diligences: fd.get("diligences") || undefined,
            dossierId: dossier ? dossier.id : undefined,
            creerRappelCalendar: fd.get("creerRappelCalendar") === "on",
          },
        });
        e.target.reset();
        addPanel.classList.remove("open");
        toggleAddBtn.textContent = "+ Ajouter une audience";
        // Se positionne sur le mois de l'audience qu'on vient de creer,
        // pour que l'utilisateur la voie tout de suite dans le calendrier.
        currentMonthStart = startOfMonth(dateAudienceLocale);
        loadMonth(activeScope);
        loadSuggestions();
      } catch (err) {
        showError(errorEl, err.message);
      }
    });
  </script>
</body>
</html>
