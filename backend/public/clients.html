<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Clients</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <div class="page-hero">
      <div class="eyebrow">Cabinet</div>
      <h1>Clients</h1>
      <p>Cette liste n'est visible que par les membres du cabinet.</p>
    </div>

    <div id="error" class="error"></div>

    <div style="margin-bottom: 4px;">
      <button type="button" id="toggle-create-btn">+ Ajouter un client</button>
    </div>

    <div class="card" id="create-card" style="display:none;">
      <h2>Ajouter un client</h2>
      <form id="create-form">
        <label>Nom</label>
        <input name="nom" required />
        <label>Email</label>
        <input name="email" type="email" />
        <label>Téléphone</label>
        <input name="telephone" />
        <label>Notes</label>
        <textarea name="notes"></textarea>
        <button type="submit">Ajouter</button>
      </form>
    </div>

    <div class="card">
      <h2>Liste des clients</h2>
      <div id="clients-list"><p class="muted">Chargement…</p></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    async function loadClients() {
      const listEl = document.getElementById("clients-list");
      try {
        const clients = await apiFetch("/api/clients");
        if (clients.length === 0) {
          listEl.innerHTML = '<p class="muted">Aucun client enregistré pour l\'instant.</p>';
          return;
        }
        listEl.innerHTML = clients
          .map((c) => {
            const actions = [];
            if (c.email) {
              actions.push(
                `<a class="icon-action" data-tooltip="Envoyer un email" href="mailto:${escapeHtml(c.email)}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
                </a>`
              );
            }
            if (c.telephone) {
              const digits = c.telephone.replace(/[^\d]/g, "");
              actions.push(
                `<a class="icon-action" data-tooltip="Envoyer un message WhatsApp" href="https://wa.me/${digits}" target="_blank" rel="noopener">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </a>`
              );
            }
            return `
          <div class="dossier-item">
            <div>
              <strong>${escapeHtml(c.nom)}</strong>
              <div class="meta">${escapeHtml(c.email || "pas d'email")} · ${escapeHtml(c.telephone || "pas de téléphone")} · ${c._count.dossiers} dossier(s)</div>
            </div>
            ${actions.length > 0 ? `<div class="icon-action-row">${actions.join("")}</div>` : ""}
          </div>`;
          })
          .join("");
      } catch (err) {
        listEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    }

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);
      loadClients();
    })();

    document.getElementById("toggle-create-btn").addEventListener("click", () => {
      const card = document.getElementById("create-card");
      card.style.display = card.style.display === "none" ? "block" : "none";
    });

    const errorEl = document.getElementById("error");
    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorEl);
      const fd = new FormData(e.target);
      try {
        await apiFetch("/api/clients", {
          method: "POST",
          body: {
            nom: fd.get("nom"),
            email: fd.get("email") || undefined,
            telephone: fd.get("telephone") || undefined,
            notes: fd.get("notes") || undefined,
          },
        });
        e.target.reset();
        document.getElementById("create-card").style.display = "none";
        loadClients();
      } catch (err) {
        showError(errorEl, err.message);
      }
    });
  </script>
</body>
</html>
