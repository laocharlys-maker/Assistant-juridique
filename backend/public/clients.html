<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Clients</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <div class="page-hero">
      <div class="eyebrow">Cabinet</div>
      <h1>Clients</h1>
      <p>Cette liste n'est visible que par les membres du cabinet.</p>
    </div>

    <div id="error" class="error"></div>

    <div style="margin-bottom: 4px;">
      <button type="button" id="toggle-create-btn">+ Ajouter un client</button>
    </div>

    <div class="card" id="create-card" style="display:none;">
      <h2>Ajouter un client</h2>
      <form id="create-form">
        <label>Type</label>
        <select name="typePersonne" id="create-typePersonne">
          <option value="physique">Personne physique</option>
          <option value="morale">Personne morale (entreprise)</option>
        </select>
        <label id="create-nom-label">Nom et prénom</label>
        <input name="nom" required />
        <label>Email</label>
        <input name="email" type="email" />
        <label>Téléphone</label>
        <input name="telephone" />
        <div id="create-physique-fields">
          <label>Date de naissance</label>
          <input name="dateNaissance" type="date" />
          <label>Lieu de naissance</label>
          <input name="lieuNaissance" />
          <label>N° de pièce d'identité (CNI, passeport...)</label>
          <input name="numeroPieceIdentite" />
          <label>Situation matrimoniale</label>
          <select name="situationMatrimoniale">
            <option value="">— Non précisé —</option>
            <option value="Célibataire">Célibataire</option>
            <option value="Marié(e)">Marié(e)</option>
            <option value="Divorcé(e)">Divorcé(e)</option>
            <option value="Veuf(ve)">Veuf(ve)</option>
          </select>
          <label>Fonction</label>
          <select name="fonction">
            <option value="">— Non précisé —</option>
            <option value="Indépendant">Indépendant</option>
            <option value="Employé">Employé</option>
          </select>
          <label>Entreprise</label>
          <input name="entreprise" />
          <label>Adresse de l'entreprise</label>
          <input name="adresseEntreprise" />
        </div>
        <label id="create-quartier-label">Quartier de résidence</label>
        <input name="quartierResidence" />
        <label>Rue</label>
        <input name="rue" />
        <label>Autre précision</label>
        <input name="autrePrecision" />
        <label>Maison</label>
        <input name="maison" />
        <label id="create-notes-label">Notes</label>
        <textarea name="notes"></textarea>
        <button type="submit">Ajouter</button>
      </form>
    </div>

    <div class="card">
      <h2>Liste des clients</h2>
      <div id="clients-list"><p class="muted">Chargement…</p></div>
    </div>
  </div>

  <div class="modal-overlay" id="email-modal" hidden>
    <div class="modal-box">
      <h2>Envoyer un email</h2>
      <p class="muted" id="email-modal-destinataire"></p>
      <div id="email-modal-error" class="error"></div>
      <form id="email-form">
        <input type="hidden" id="email-modal-client-id" />
        <label>Objet</label>
        <input name="objet" id="email-modal-objet" required />
        <label>Message</label>
        <textarea name="message" required style="min-height:160px;"></textarea>
        <label>Pièce jointe (optionnel)</label>
        <input type="file" id="email-modal-attachment" />
        <div style="display:flex; gap:10px; margin-top:18px;">
          <button type="submit">Envoyer</button>
          <button type="button" class="secondary" id="email-modal-cancel">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="detail-modal" hidden>
    <div class="modal-box">
      <div id="detail-view">
        <h2 id="detail-nom"></h2>
        <div id="detail-fields"></div>
        <div style="display:flex; gap:10px; margin-top:18px;">
          <button type="button" id="detail-modifier-btn">Modifier</button>
          <button type="button" class="secondary" id="detail-close-btn">Fermer</button>
        </div>
      </div>
      <div id="detail-edit" style="display:none;">
        <h2>Modifier le client</h2>
        <div id="detail-edit-error" class="error"></div>
        <form id="detail-edit-form">
          <input type="hidden" id="edit-client-id" />
          <label>Type</label>
          <select name="typePersonne" id="edit-typePersonne">
            <option value="physique">Personne physique</option>
            <option value="morale">Personne morale (entreprise)</option>
          </select>
          <label id="edit-nom-label">Nom et prénom</label>
          <input name="nom" id="edit-nom" required />
          <label>Email</label>
          <input name="email" id="edit-email" type="email" />
          <label>Téléphone</label>
          <input name="telephone" id="edit-telephone" />
          <div id="edit-physique-fields">
            <label>Date de naissance</label>
            <input name="dateNaissance" id="edit-dateNaissance" type="date" />
            <label>Lieu de naissance</label>
            <input name="lieuNaissance" id="edit-lieuNaissance" />
            <label>N° de pièce d'identité (CNI, passeport...)</label>
            <input name="numeroPieceIdentite" id="edit-numeroPieceIdentite" />
            <label>Situation matrimoniale</label>
            <select name="situationMatrimoniale" id="edit-situationMatrimoniale">
              <option value="">— Non précisé —</option>
              <option value="Célibataire">Célibataire</option>
              <option value="Marié(e)">Marié(e)</option>
              <option value="Divorcé(e)">Divorcé(e)</option>
              <option value="Veuf(ve)">Veuf(ve)</option>
            </select>
            <label>Fonction</label>
            <select name="fonction" id="edit-fonction">
              <option value="">— Non précisé —</option>
              <option value="Indépendant">Indépendant</option>
              <option value="Employé">Employé</option>
            </select>
            <label>Entreprise</label>
            <input name="entreprise" id="edit-entreprise" />
            <label>Adresse de l'entreprise</label>
            <input name="adresseEntreprise" id="edit-adresseEntreprise" />
          </div>
          <label id="edit-quartier-label">Quartier de résidence</label>
          <input name="quartierResidence" id="edit-quartierResidence" />
          <label>Rue</label>
          <input name="rue" id="edit-rue" />
          <label>Autre précision</label>
          <input name="autrePrecision" id="edit-autrePrecision" />
          <label>Maison</label>
          <input name="maison" id="edit-maison" />
          <label id="edit-notes-label">Notes</label>
          <textarea name="notes" id="edit-notes"></textarea>
          <div style="display:flex; gap:10px; margin-top:18px;">
            <button type="submit">Enregistrer</button>
            <button type="button" class="ghost" id="edit-cancel-btn">Annuler</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function formatDate(iso) {
      return formatDateLongue(iso);
    }

    let clientsCache = [];

    async function loadClients() {
      const listEl = document.getElementById("clients-list");
      try {
        const clients = await apiFetch("/api/clients");
        clientsCache = clients;
        if (clients.length === 0) {
          listEl.innerHTML = '<p class="muted">Aucun client enregistré pour l\'instant.</p>';
          return;
        }
        listEl.innerHTML = clients
          .map((c) => {
            const actions = [];
            if (c.email) {
              actions.push(
                `<button type="button" class="icon-action" data-tooltip="Envoyer un email" data-open-email="${c.id}" data-nom="${escapeHtml(c.nom)}" data-email="${escapeHtml(c.email)}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
                </button>`
              );
            }
            if (c.telephone) {
              const digits = c.telephone.replace(/[^\d]/g, "");
              actions.push(
                `<a class="icon-action" data-tooltip="Envoyer un message WhatsApp" href="https://wa.me/${digits}" target="_blank" rel="noopener">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </a>`
              );
            }
            return `
          <div class="dossier-item">
            <div>
              <strong><a href="#" data-open-detail="${c.id}" style="color:inherit; text-decoration:underline; text-decoration-style:dotted;">${escapeHtml(c.nom)}</a></strong>
              <div class="meta">${escapeHtml(c.email || "pas d'email")} · ${escapeHtml(c.telephone || "pas de téléphone")} · ${c._count.dossiers} dossier(s)</div>
            </div>
            ${actions.length > 0 ? `<div class="icon-action-row">${actions.join("")}</div>` : ""}
          </div>`;
          })
          .join("");

        listEl.querySelectorAll("[data-open-email]").forEach((btn) => {
          btn.addEventListener("click", () => {
            openEmailModal(btn.dataset.openEmail, btn.dataset.nom, btn.dataset.email);
          });
        });
        listEl.querySelectorAll("[data-open-detail]").forEach((link) => {
          link.addEventListener("click", (e) => {
            e.preventDefault();
            openDetailModal(link.dataset.openDetail);
          });
        });
      } catch (err) {
        listEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    }

    function openEmailModal(clientId, nom, email) {
      document.getElementById("email-modal-client-id").value = clientId;
      document.getElementById("email-modal-destinataire").textContent = `${nom} — ${email}`;
      document.getElementById("email-form").reset();
      hideError(document.getElementById("email-modal-error"));
      document.getElementById("email-modal").hidden = false;
      document.getElementById("email-modal-objet").focus();
    }
    function closeEmailModal() {
      document.getElementById("email-modal").hidden = true;
    }

    // Bascule l'affichage des champs propres a une personne physique
    // (naissance, piece d'identite, situation matrimoniale, fonction,
    // entreprise employeuse) selon le type choisi - une entreprise n'a pas
    // ces attributs, seulement une adresse de siege social et des
    // informations complementaires (RCCM, forme juridique...) en notes.
    function applyTypePersonneLabels(prefix, type) {
      const estMorale = type === "morale";
      const physiqueFields = document.getElementById(`${prefix}-physique-fields`);
      if (physiqueFields) physiqueFields.style.display = estMorale ? "none" : "block";
      const nomLabel = document.getElementById(`${prefix}-nom-label`);
      if (nomLabel) nomLabel.textContent = estMorale ? "Nom de la société / raison sociale" : "Nom et prénom";
      const quartierLabel = document.getElementById(`${prefix}-quartier-label`);
      if (quartierLabel) quartierLabel.textContent = estMorale ? "Quartier du siège social" : "Quartier de résidence";
      const notesLabel = document.getElementById(`${prefix}-notes-label`);
      if (notesLabel) notesLabel.textContent = estMorale ? "Informations complémentaires (RCCM, forme juridique...)" : "Notes";
    }

    const TYPE_PERSONNE_LABELS = { physique: "Personne physique", morale: "Personne morale (entreprise)" };

    const DETAIL_FIELDS = [
      ["typePersonne", "Type", (v) => TYPE_PERSONNE_LABELS[v] || v],
      ["email", "Email"],
      ["telephone", "Téléphone"],
      ["dateNaissance", "Date de naissance", formatDate],
      ["lieuNaissance", "Lieu de naissance"],
      ["numeroPieceIdentite", "N° de pièce d'identité"],
      ["quartierResidence", "Quartier de résidence"],
      ["rue", "Rue"],
      ["autrePrecision", "Autre précision"],
      ["maison", "Maison"],
      ["situationMatrimoniale", "Situation matrimoniale"],
      ["fonction", "Fonction"],
      ["entreprise", "Entreprise"],
      ["adresseEntreprise", "Adresse de l'entreprise"],
      ["notes", "Notes"],
    ];

    function openDetailModal(clientId) {
      const c = clientsCache.find((x) => x.id === clientId);
      if (!c) return;
      document.getElementById("detail-nom").textContent = c.nom;
      const rows = DETAIL_FIELDS.map(([key, label, formatter]) => {
        if (!c[key]) return "";
        const value = formatter ? formatter(c[key]) : c[key];
        return `<p><strong>${label} :</strong> ${escapeHtml(String(value))}</p>`;
      })
        .filter(Boolean)
        .join("");
      document.getElementById("detail-fields").innerHTML =
        rows || '<p class="muted">Aucune information complémentaire renseignée pour ce client.</p>';
      document.getElementById("detail-modifier-btn").dataset.clientId = clientId;
      document.getElementById("detail-view").style.display = "block";
      document.getElementById("detail-edit").style.display = "none";
      document.getElementById("detail-modal").hidden = false;
    }
    function closeDetailModal() {
      document.getElementById("detail-modal").hidden = true;
    }

    function openEditForm(clientId) {
      const c = clientsCache.find((x) => x.id === clientId);
      if (!c) return;
      document.getElementById("edit-client-id").value = c.id;
      document.getElementById("edit-typePersonne").value = c.typePersonne || "physique";
      applyTypePersonneLabels("edit", c.typePersonne || "physique");
      document.getElementById("edit-nom").value = c.nom || "";
      document.getElementById("edit-email").value = c.email || "";
      document.getElementById("edit-telephone").value = c.telephone || "";
      document.getElementById("edit-dateNaissance").value = c.dateNaissance ? c.dateNaissance.slice(0, 10) : "";
      document.getElementById("edit-lieuNaissance").value = c.lieuNaissance || "";
      document.getElementById("edit-numeroPieceIdentite").value = c.numeroPieceIdentite || "";
      document.getElementById("edit-quartierResidence").value = c.quartierResidence || "";
      document.getElementById("edit-rue").value = c.rue || "";
      document.getElementById("edit-autrePrecision").value = c.autrePrecision || "";
      document.getElementById("edit-maison").value = c.maison || "";
      document.getElementById("edit-situationMatrimoniale").value = c.situationMatrimoniale || "";
      document.getElementById("edit-fonction").value = c.fonction || "";
      document.getElementById("edit-entreprise").value = c.entreprise || "";
      document.getElementById("edit-adresseEntreprise").value = c.adresseEntreprise || "";
      document.getElementById("edit-notes").value = c.notes || "";
      hideError(document.getElementById("detail-edit-error"));
      document.getElementById("detail-view").style.display = "none";
      document.getElementById("detail-edit").style.display = "block";
    }

    document.getElementById("create-typePersonne").addEventListener("change", (e) => {
      applyTypePersonneLabels("create", e.target.value);
    });
    document.getElementById("edit-typePersonne").addEventListener("change", (e) => {
      applyTypePersonneLabels("edit", e.target.value);
    });

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);
      loadClients();
    })();

    document.getElementById("toggle-create-btn").addEventListener("click", () => {
      const card = document.getElementById("create-card");
      card.style.display = card.style.display === "none" ? "block" : "none";
    });

    const errorEl = document.getElementById("error");
    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorEl);
      const fd = new FormData(e.target);
      try {
        await apiFetch("/api/clients", {
          method: "POST",
          body: Object.fromEntries(
            [...fd.entries()].map(([k, v]) => [k, v || undefined])
          ),
        });
        e.target.reset();
        document.getElementById("create-card").style.display = "none";
        loadClients();
      } catch (err) {
        showError(errorEl, err.message);
      }
    });

    document.getElementById("email-modal-cancel").addEventListener("click", closeEmailModal);
    document.getElementById("email-modal").addEventListener("click", (e) => {
      if (e.target.id === "email-modal") closeEmailModal();
    });

    document.getElementById("detail-close-btn").addEventListener("click", closeDetailModal);
    document.getElementById("detail-modal").addEventListener("click", (e) => {
      if (e.target.id === "detail-modal") closeDetailModal();
    });
    document.getElementById("detail-modifier-btn").addEventListener("click", (e) => {
      openEditForm(e.target.dataset.clientId);
    });
    document.getElementById("edit-cancel-btn").addEventListener("click", () => {
      document.getElementById("detail-view").style.display = "block";
      document.getElementById("detail-edit").style.display = "none";
    });

    document.getElementById("detail-edit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const editErrorEl = document.getElementById("detail-edit-error");
      hideError(editErrorEl);
      const clientId = document.getElementById("edit-client-id").value;
      const fd = new FormData(e.target);
      try {
        await apiFetch(`/api/clients/${clientId}`, {
          method: "PATCH",
          body: Object.fromEntries([...fd.entries()].map(([k, v]) => [k, v || undefined])),
        });
        await loadClients();
        closeDetailModal();
      } catch (err) {
        showError(editErrorEl, err.message);
      }
    });

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("email-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const modalErrorEl = document.getElementById("email-modal-error");
      hideError(modalErrorEl);
      const clientId = document.getElementById("email-modal-client-id").value;
      const fd = new FormData(e.target);
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        const file = document.getElementById("email-modal-attachment").files[0];
        const pieceJointeDataUrl = file ? await readFileAsDataUrl(file) : undefined;
        const res = await apiFetch(`/api/clients/${clientId}/envoyer-email`, {
          method: "POST",
          body: {
            objet: fd.get("objet"),
            message: fd.get("message"),
            pieceJointeDataUrl,
            pieceJointeNom: file ? file.name : undefined,
          },
        });
        if (!res.n8nDispatched) {
          showError(modalErrorEl, "L'email n'a pas pu être transmis (n8n indisponible). Réessaie dans quelques instants.");
          submitBtn.disabled = false;
          return;
        }
        closeEmailModal();
      } catch (err) {
        showError(modalErrorEl, err.message || "Impossible de lire la pièce jointe");
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
