<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Journal plateforme</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <div class="page-hero">
      <div class="eyebrow">Plateforme</div>
      <h1>Journal plateforme</h1>
      <p>Historique technique des documents générés, tous cabinets confondus (extraction IA, génération du document). Aucun contenu de document n'apparaît ici.</p>
    </div>

    <div id="error" class="error"></div>

    <div class="card">
      <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:12px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <label style="margin:0; font-weight:400;">Statut :</label>
          <select id="filter-statut" style="width:auto;">
            <option value="">Tout</option>
            <option value="erreur">Erreurs uniquement</option>
            <option value="succes">Succès uniquement</option>
          </select>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <label style="margin:0; font-weight:400;">Mois :</label>
          <select id="filter-mois" style="width:auto;"><option value="">Tout</option></select>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <label style="margin:0; font-weight:400;">Étape :</label>
          <select id="filter-etape" style="width:auto;">
            <option value="">Tout</option>
            <option value="extraction_ia">Extraction IA</option>
            <option value="redaction_ia">Rédaction IA</option>
            <option value="envoi_email">Envoi email</option>
          </select>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <label style="margin:0; font-weight:400;">Type de document :</label>
          <select id="filter-type" style="width:auto;"><option value="">Tout</option></select>
        </div>
      </div>
      <div id="logs-list"><p class="muted">Chargement…</p></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleString("fr-FR");
    }

    const TYPE_LABELS = {
      notes: "Compte-rendu d'audience",
      redac: "Plaidoirie",
      conclusions: "Conclusions",
      assignation: "Assignation",
      mise_en_demeure: "Mise en demeure",
      jurisprudence: "Recherche de jurisprudence",
      recherche_juridique: "Recherche juridique",
      resume_pdf: "Résumé de jurisprudence",
      veille_juridique: "Veille juridique",
      traduction: "Traduction",
      plainte: "Plainte",
      contrat: "Contrat",
      notification_date: "Notification",
      requete: "Requête",
      projet_ordonnance: "Projet d'ordonnance",
      note_plaidoirie: "Note de plaidoirie",
    };

    function remplirFiltreMois() {
      const select = document.getElementById("filter-mois");
      const maintenant = new Date();
      let options = '<option value="">Tout</option>';
      for (let i = 0; i < 12; i++) {
        const d = new Date(maintenant.getFullYear(), maintenant.getMonth() - i, 1);
        const label = d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
        options += `<option value="${d.getMonth() + 1},${d.getFullYear()}">${escapeHtml(label)}</option>`;
      }
      select.innerHTML = options;
    }

    function remplirFiltreType() {
      const select = document.getElementById("filter-type");
      select.innerHTML =
        '<option value="">Tout</option>' +
        Object.entries(TYPE_LABELS)
          .sort((a, b) => a[1].localeCompare(b[1]))
          .map(([key, label]) => `<option value="${key}">${escapeHtml(label)}</option>`)
          .join("");
    }

    async function loadLogs() {
      const listEl = document.getElementById("logs-list");
      const statut = document.getElementById("filter-statut").value;
      const moisValeur = document.getElementById("filter-mois").value;
      const typeAction = document.getElementById("filter-type").value;
      const etape = document.getElementById("filter-etape").value;
      listEl.innerHTML = '<p class="muted">Chargement…</p>';
      try {
        const params = new URLSearchParams();
        if (statut) params.set("statut", statut);
        if (moisValeur) {
          const [mois, annee] = moisValeur.split(",");
          params.set("mois", mois);
          params.set("annee", annee);
        }
        if (typeAction) params.set("typeAction", typeAction);
        if (etape) params.set("etape", etape);
        const qs = params.toString() ? `?${params.toString()}` : "";
        const logs = await apiFetch(`/api/admin/audit-logs${qs}`);
        if (logs.length === 0) {
          listEl.innerHTML = '<p class="muted">Aucune entrée.</p>';
          return;
        }
        listEl.innerHTML = logs
          .map(
            (l) => `
            <div class="dossier-item">
              <div>
                <strong>${escapeHtml(l.etape)}</strong>
                <span style="color:${l.statut === "erreur" ? "var(--danger)" : "var(--success)"}; font-weight:600; margin-left:8px;">${l.statut === "erreur" ? "Erreur" : "Succès"}</span>
                <div class="meta">
                  ${formatDate(l.timestamp)} · ${escapeHtml(l.cabinet?.nom || "-")} · Dossier ${escapeHtml(l.dossier?.numeroDossier || "-")} — ${escapeHtml(l.dossier?.nomAffaire || "-")} · ${escapeHtml(l.typeAction)} (${escapeHtml(l.canal)}) · Généré par ${escapeHtml(l.genrePar || "-")}
                  ${l.detail ? `<br />${escapeHtml(l.detail)}` : ""}
                </div>
              </div>
            </div>`
          )
          .join("");
      } catch (err) {
        listEl.innerHTML = `<p class="error visible">${escapeHtml(err.message)}</p>`;
      }
    }

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);
      remplirFiltreMois();
      remplirFiltreType();
      loadLogs();
    })();

    document.getElementById("filter-statut").addEventListener("change", loadLogs);
    document.getElementById("filter-mois").addEventListener("change", loadLogs);
    document.getElementById("filter-type").addEventListener("change", loadLogs);
    document.getElementById("filter-etape").addEventListener("change", loadLogs);
  </script>
</body>
</html>
