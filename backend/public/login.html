<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Connexion</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      background-image:
        radial-gradient(ellipse 900px 500px at 15% -10%, var(--bg-grad-1), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 10%, var(--bg-grad-2), transparent 55%);
      background-repeat: no-repeat;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div class="page" style="max-width: 420px; margin-top: 8vh;">
    <div class="card">
      <div style="text-align:center; margin-bottom:8px;">
        <img src="/logo-aurore-login.png" alt="Aurore" style="max-width:200px;" onerror="this.style.display='none'" />
        <h1 style="margin-top:8px; margin-bottom:0;">Aurore</h1>
        <p class="muted">Assistant juridique du cabinet</p>
      </div>
      <div id="error" class="error"></div>

      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <button type="submit">Se connecter</button>
      </form>

      <!-- Affiche uniquement si aucun cabinet n'existe encore sur ce poste
           (mode desktop, tout premier lancement - voir routes/auth.ts,
           GET /api/auth/premier-lancement) - jamais visible une fois un
           cabinet cree. -->
      <form id="premier-lancement-form" style="display:none;">
        <p class="muted" style="margin-top:0;">Aucun cabinet n'est encore configuré sur ce poste — crée le compte administrateur du cabinet.</p>
        <label for="pl-cabinet-nom">Nom du cabinet</label>
        <input id="pl-cabinet-nom" required />
        <label for="pl-nom">Ton nom</label>
        <input id="pl-nom" required />
        <label for="pl-email">Email</label>
        <input id="pl-email" type="email" required autocomplete="username" />
        <label for="pl-password">Mot de passe (8 caractères minimum)</label>
        <input id="pl-password" type="password" required minlength="8" autocomplete="new-password" />
        <button type="submit">Créer le cabinet</button>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const loginForm = document.getElementById("login-form");
    const premierLancementForm = document.getElementById("premier-lancement-form");
    const errorEl = document.getElementById("error");

    function apresConnexion(user) {
      window.location.href =
        user.role === "titulaire" || user.role === "avocat" ? "/tableau-de-bord.html" : "/dashboard.html";
    }

    function gererErreurConnexion(err) {
      // Licence absente/expiree/bloquee (voir middleware/requireLicence.ts) :
      // se connecter est impossible tant que ce n'est pas resolu - inutile
      // de laisser l'utilisateur bloque sur un message d'erreur seul,
      // autant l'emmener directement sur l'ecran d'activation (meme logique
      // que requireSession() dans api.js pour les pages deja authentifiees).
      if (err && err.body && err.body.licenceEtat) {
        window.location.href = "/licence.html";
        return;
      }
      showError(errorEl, err.message);
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorEl);
      try {
        const user = await apiFetch("/api/auth/login", {
          method: "POST",
          body: {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          },
        });
        apresConnexion(user);
      } catch (err) {
        gererErreurConnexion(err);
      }
    });

    premierLancementForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorEl);
      try {
        const user = await apiFetch("/api/auth/premier-lancement", {
          method: "POST",
          body: {
            cabinetNom: document.getElementById("pl-cabinet-nom").value,
            nom: document.getElementById("pl-nom").value,
            email: document.getElementById("pl-email").value,
            password: document.getElementById("pl-password").value,
          },
        });
        apresConnexion(user);
      } catch (err) {
        gererErreurConnexion(err);
      }
    });

    (async () => {
      try {
        const { disponible } = await apiFetch("/api/auth/premier-lancement");
        if (disponible) {
          loginForm.style.display = "none";
          premierLancementForm.style.display = "block";
        }
      } catch {
        // Echec silencieux : le formulaire de connexion habituel reste
        // affiche par defaut, comportement identique a avant cet ajout.
      }
    })();
  </script>
</body>
</html>
