<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Connexion</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      background-image:
        radial-gradient(ellipse 900px 500px at 15% -10%, var(--bg-grad-1), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 10%, var(--bg-grad-2), transparent 55%);
      background-repeat: no-repeat;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div class="page" style="max-width: 420px; margin-top: 8vh;">
    <div class="card">
      <div style="text-align:center; margin-bottom:8px;">
        <img src="/logo-aurore-login.png" alt="Aurore" style="max-width:200px;" onerror="this.style.display='none'" />
        <h1 style="margin-top:8px; margin-bottom:0;">Aurore</h1>
        <p class="muted">Assistant juridique du cabinet</p>
      </div>
      <div id="error" class="error"></div>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <button type="submit">Se connecter</button>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorEl);
      try {
        const user = await apiFetch("/api/auth/login", {
          method: "POST",
          body: {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          },
        });
        window.location.href =
          user.role === "titulaire" || user.role === "avocat" ? "/tableau-de-bord.html" : "/dashboard.html";
      } catch (err) {
        // Licence absente/expiree/bloquee (voir middleware/requireLicence.ts) :
        // se connecter est impossible tant que ce n'est pas resolu - inutile
        // de laisser l'utilisateur bloque sur un message d'erreur seul,
        // autant l'emmener directement sur l'ecran d'activation (meme logique
        // que requireSession() dans api.js pour les pages deja authentifiees).
        if (err && err.body && err.body.licenceEtat) {
          window.location.href = "/licence.html";
          return;
        }
        showError(errorEl, err.message);
      }
    });
  </script>
</body>
</html>
