<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Rôle de la semaine</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .role-hebdo-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
    .role-hebdo-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; background: var(--panel); }
    .role-hebdo-table th, .role-hebdo-table td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; font-size: 0.88rem; }
    .role-hebdo-table th { background: var(--panel-alt); color: var(--text-strong); }
    .role-hebdo-date-header { text-align: center; font-weight: 700; background: var(--accent-tint); padding: 10px; border: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.02em; }
    .role-hebdo-autres { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .semaine-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .semaine-nav-label { font-weight: 600; min-width: 220px; }
    .semaine-filtres-types { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
    .semaine-filtres-types label { display: flex; align-items: center; gap: 6px; font-weight: 400; white-space: nowrap; }
    @media print {
      .app-topbar, .sidebar, .no-print, .page-hero p, #period-actions, #semaine-filtres { display: none !important; }
      .app-shell, .main-area { display: block !important; }
      .page { max-width: 100%; padding: 0; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-hero">
      <div class="eyebrow">Procédure</div>
      <h1>Rôle de la semaine</h1>
      <p>Audiences et événements de la semaine consultée — navigue entre les semaines et choisis les types d'événements à afficher.</p>
    </div>

    <div id="error" class="error"></div>

    <div class="card" id="semaine-filtres">
      <div class="semaine-nav">
        <button type="button" class="ghost" id="semaine-precedente-btn">◀ Semaine précédente</button>
        <span class="semaine-nav-label" id="semaine-nav-label">Semaine…</span>
        <button type="button" class="ghost" id="semaine-suivante-btn">Semaine suivante ▶</button>
        <button type="button" class="secondary" id="semaine-reset-btn" style="margin-left:auto;">Revenir à la semaine suivante</button>
      </div>
      <div class="semaine-filtres-types" id="semaine-filtres-types"></div>
    </div>

    <div id="content"><p class="muted">Chargement…</p></div>
  </div>

  <div class="modal-overlay" id="edit-modal" hidden>
    <div class="modal-box">
      <h2>Modifier l'audience</h2>
      <div id="edit-error" class="error"></div>
      <form id="edit-form">
        <input type="hidden" id="edit-id" />
        <label>Juridiction</label>
        <input name="juridiction" id="edit-juridiction" required />
        <label>Chambre (optionnel)</label>
        <input name="chambre" id="edit-chambre" />
        <label>Numéro de procédure (optionnel)</label>
        <input name="procedureNumero" id="edit-procedureNumero" />
        <label>Parties</label>
        <input name="parties" id="edit-parties" required />
        <label>Qualité procédurale du client (optionnel)</label>
        <select name="qualiteProcedurale" id="edit-qualiteProcedurale">
          <option value="">— Non précisé —</option>
          <option value="Demandeur">Demandeur</option>
          <option value="Défendeur">Défendeur</option>
          <option value="Intervenant volontaire">Intervenant volontaire</option>
          <option value="Intervenant forcé">Intervenant forcé</option>
          <option value="Appelant">Appelant</option>
          <option value="Intimé">Intimé</option>
          <option value="Demandeur au pourvoi">Demandeur au pourvoi</option>
          <option value="Défendeur au pourvoi">Défendeur au pourvoi</option>
        </select>
        <label>Objet de la procédure (optionnel)</label>
        <input name="objetProcedure" id="edit-objetProcedure" />
        <label>Dernier motif (optionnel)</label>
        <input name="dernierMotif" id="edit-dernierMotif" />
        <label>Diligences (optionnel)</label>
        <input name="diligences" id="edit-diligences" />
        <div style="display:flex; gap:10px; margin-top:18px;">
          <button type="submit">Enregistrer</button>
          <button type="button" class="secondary" id="edit-cancel-btn">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    const JOURS_LETTRES = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];

    // Types d'evenement pris en charge (voir routes/evenements.ts,
    // TYPES_EVENEMENT) - "audience" a part car source de donnees riche
    // (RoleAudience) distincte des 5 autres (Evenement generique).
    const TYPES_LABELS = {
      audience: "Audiences",
      rdv: "RDV",
      appel: "Appels",
      tache: "Tâches",
      echeance_procedure: "Échéances de procédure",
      autre: "Autres",
    };
    // Forme singuliere - badge d'un evenement precis (voir renderContenu) :
    // "Échéances de procédure" ne se derive pas correctement d'un simple
    // retrait du "s" final (le pluriel n'est pas en fin de chaine), d'ou une
    // table dediee plutot qu'une transformation par regex.
    const TYPES_LABELS_SINGULIER = {
      audience: "Audience",
      rdv: "RDV",
      appel: "Appel",
      tache: "Tâche",
      echeance_procedure: "Échéance de procédure",
      autre: "Autre",
    };
    const TYPES_ORDRE = ["audience", "rdv", "appel", "tache", "echeance_procedure", "autre"];

    function toLocalDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatHeure(iso) {
      return new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }

    function formatEnTeteJour(date) {
      const jour = JOURS_LETTRES[date.getDay()];
      const jourMois = date.getDate();
      const mois = date.toLocaleDateString("fr-FR", { month: "long" });
      const annee = date.getFullYear();
      return `Audience du ${jour} ${jourMois} ${mois} ${annee}`.toUpperCase();
    }

    function formatJourGenerique(date) {
      const jour = JOURS_LETTRES[date.getDay()];
      const jourMois = date.getDate();
      const mois = date.toLocaleDateString("fr-FR", { month: "long" });
      return `${jour} ${jourMois} ${mois}`.toUpperCase();
    }

    let dernieresAudiences = [];
    // Lundi de la semaine actuellement consultee (Date, minuit UTC) - null
    // tant que la premiere reponse serveur n'est pas arrivee (le serveur
    // fixe la valeur par defaut : semaine suivante, voir routes/roleAudiences.ts).
    let semaineDebut = null;
    // Types coches - "Tout" par defaut (voir demande explicite).
    let typesSelectionnes = new Set(TYPES_ORDRE);

    function renderFiltresTypes() {
      const el = document.getElementById("semaine-filtres-types");
      el.innerHTML = TYPES_ORDRE.map(
        (t) => `
        <label>
          <input type="checkbox" data-type-filtre="${t}" ${typesSelectionnes.has(t) ? "checked" : ""} />
          ${TYPES_LABELS[t]}
        </label>`
      ).join("");
      el.querySelectorAll("[data-type-filtre]").forEach((cb) => {
        cb.addEventListener("change", () => {
          if (cb.checked) typesSelectionnes.add(cb.dataset.typeFiltre);
          else typesSelectionnes.delete(cb.dataset.typeFiltre);
          renderContenu();
        });
      });
    }

    // Construite au moment du clic (jamais mise en cache) : reflete toujours
    // la semaine et les types actuellement selectionnes, y compris juste
    // apres un changement de filtre sans rechargement (voir renderContenu()).
    function urlExport(format) {
      const debutIso = semaineDebut.toISOString();
      const types = [...typesSelectionnes].join(",");
      return `/api/role-audiences/semaine/${format}?debut=${encodeURIComponent(debutIso)}&types=${encodeURIComponent(types)}`;
    }

    function majLabelSemaine() {
      if (!semaineDebut) return;
      const dernierJour = new Date(semaineDebut);
      dernierJour.setDate(dernierJour.getDate() + 6);
      const fmt = (d) => d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
      document.getElementById("semaine-nav-label").textContent = `Semaine du ${fmt(semaineDebut)} au ${fmt(dernierJour)}`;
    }

    let audiencesCourantes = [];
    let evenementsCourants = [];

    async function chargerSemaine() {
      const errorEl = document.getElementById("error");
      hideError(errorEl);
      const contentEl = document.getElementById("content");
      contentEl.innerHTML = '<p class="muted">Chargement…</p>';
      try {
        const paramsAudiences = semaineDebut ? `?debut=${encodeURIComponent(semaineDebut.toISOString())}` : "";
        const dataAudiences = await apiFetch(`/api/role-audiences/semaine${paramsAudiences}`);

        semaineDebut = new Date(dataAudiences.debut);
        const fin = new Date(dataAudiences.fin);

        const dataEvenements = await apiFetch(
          `/api/evenements?debut=${encodeURIComponent(semaineDebut.toISOString())}&fin=${encodeURIComponent(fin.toISOString())}&scope=${dataAudiences.scope}`
        );

        audiencesCourantes = dataAudiences.audiences;
        dernieresAudiences = audiencesCourantes;
        // "audience" deja couvert par audiencesCourantes (donnees riches) -
        // jamais duplique via la liste generique des evenements.
        evenementsCourants = dataEvenements.evenements.filter((e) => e.type !== "audience");

        majLabelSemaine();
        renderContenu();
      } catch (err) {
        showError(errorEl, err.message);
        contentEl.innerHTML = "";
      }
    }

    function renderContenu() {
      const contentEl = document.getElementById("content");

      const afficherAudiences = typesSelectionnes.has("audience");
      const audiencesAffichees = afficherAudiences ? audiencesCourantes : [];
      const evenementsAffiches = evenementsCourants.filter((e) => typesSelectionnes.has(e.type));

      if (audiencesAffichees.length === 0 && evenementsAffiches.length === 0) {
        contentEl.innerHTML = `<div class="card"><p class="muted" style="margin:0;">Aucun événement pour cette semaine, avec les types actuellement sélectionnés.</p></div>`;
        return;
      }

      const parJour = new Map();
      const cleJour = (iso) => toLocalDateStr(new Date(iso));
      audiencesAffichees.forEach((a) => {
        const key = cleJour(a.dateAudience);
        if (!parJour.has(key)) parJour.set(key, { audiences: [], evenements: [] });
        parJour.get(key).audiences.push(a);
      });
      evenementsAffiches.forEach((e) => {
        const key = cleJour(e.dateDebut);
        if (!parJour.has(key)) parJour.set(key, { audiences: [], evenements: [] });
        parJour.get(key).evenements.push(e);
      });

      const jours = Array.from(parJour.keys()).sort();

      contentEl.innerHTML = `
        <div id="period-actions" style="display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-bottom:16px;">
          <button type="button" class="secondary" id="print-btn" style="margin-top:0;">Imprimer</button>
          <button type="button" class="secondary" id="telecharger-pdf-btn" style="margin-top:0;">Télécharger PDF</button>
          <button type="button" class="secondary" id="telecharger-word-btn" style="margin-top:0;">Télécharger Word</button>
        </div>
        <div class="role-hebdo-card">
          ${jours
            .map((jourKey) => {
              const { audiences: audiencesDuJour, evenements: evenementsDuJour } = parJour.get(jourKey);
              const dateJour = new Date(audiencesDuJour[0] ? audiencesDuJour[0].dateAudience : evenementsDuJour[0].dateDebut);
              return `
              ${
                audiencesDuJour.length > 0
                  ? `
                <table class="role-hebdo-table">
                  <thead>
                    <tr><th colspan="7" class="role-hebdo-date-header">${escapeHtml(formatEnTeteJour(dateJour))}</th></tr>
                    <tr>
                      <th>Heure</th>
                      <th>Juridiction / Chambre / Procédure</th>
                      <th>Parties</th>
                      <th>Qualité procédurale du client</th>
                      <th>Objet de la procédure</th>
                      <th>Dernier motif / Diligences</th>
                      <th class="no-print"></th>
                    </tr>
                  </thead>
                  <tbody>
                    ${audiencesDuJour
                      .map(
                        (a) => `
                      <tr>
                        <td>${formatHeure(a.dateAudience)}</td>
                        <td>${escapeHtml(a.juridiction)}${a.chambre ? "<br />" + escapeHtml(a.chambre) : ""}${a.procedureNumero ? "<br />" + escapeHtml(a.procedureNumero) : ""}</td>
                        <td>${escapeHtml(a.parties)}</td>
                        <td>${escapeHtml(a.qualiteProcedurale || "")}</td>
                        <td>${escapeHtml(a.objetProcedure || "")}</td>
                        <td>${escapeHtml(a.dernierMotif || "")}${a.diligences ? "<br />" + escapeHtml(a.diligences) : ""}</td>
                        <td class="no-print"><button type="button" class="ghost btn-sm" data-modifier="${a.id}">Modifier</button></td>
                      </tr>`
                      )
                      .join("")}
                  </tbody>
                </table>`
                  : `<p class="role-hebdo-date-header" style="margin:0 0 10px;">${escapeHtml(formatJourGenerique(dateJour))}</p>`
              }
              ${
                evenementsDuJour.length > 0
                  ? `<div class="role-hebdo-autres">
                    ${evenementsDuJour
                      .map(
                        (e) => `
                      <div class="action-item">
                        <span class="tag">${escapeHtml(e.titre)}</span>
                        <span class="badge badge-evenement-${e.type}">${TYPES_LABELS_SINGULIER[e.type] || e.type}</span>
                        <div>${e.touteLaJournee ? "Toute la journée" : formatHeure(e.dateDebut)}${e.lieu ? " — " + escapeHtml(e.lieu) : ""}</div>
                        ${e.description ? `<p class="muted" style="margin:4px 0 0;">${escapeHtml(e.description)}</p>` : ""}
                      </div>`
                      )
                      .join("")}
                  </div>`
                  : ""
              }
            `;
            })
            .join("")}
        </div>
      `;

      document.getElementById("print-btn").addEventListener("click", () => window.print());
      // Jamais un simple <a href> vers une route API authentifiee : sans
      // effet dans la webview desktop (Tauri) - meme raisonnement que
      // partout ailleurs dans l'app (voir js/api.js, downloadFile()) :
      // fetch + blob + lien ephemere declenche par script, jamais une
      // navigation directe.
      document.getElementById("telecharger-pdf-btn").addEventListener("click", async () => {
        try {
          await downloadFile(urlExport("pdf"), "role-de-la-semaine.pdf");
        } catch (err) {
          showError(document.getElementById("error"), err.message);
        }
      });
      document.getElementById("telecharger-word-btn").addEventListener("click", async () => {
        try {
          await downloadFile(urlExport("word"), "role-de-la-semaine.docx");
        } catch (err) {
          showError(document.getElementById("error"), err.message);
        }
      });
      contentEl.querySelectorAll("[data-modifier]").forEach((btn) => {
        btn.addEventListener("click", () => ouvrirEdition(btn.dataset.modifier));
      });
    }

    document.getElementById("semaine-precedente-btn").addEventListener("click", () => {
      semaineDebut.setDate(semaineDebut.getDate() - 7);
      chargerSemaine();
    });
    document.getElementById("semaine-suivante-btn").addEventListener("click", () => {
      semaineDebut.setDate(semaineDebut.getDate() + 7);
      chargerSemaine();
    });
    document.getElementById("semaine-reset-btn").addEventListener("click", () => {
      semaineDebut = null;
      chargerSemaine();
    });

    const editModal = document.getElementById("edit-modal");

    function ouvrirEdition(id) {
      const audience = dernieresAudiences.find((a) => a.id === id);
      if (!audience) return;
      document.getElementById("edit-id").value = audience.id;
      document.getElementById("edit-juridiction").value = audience.juridiction || "";
      document.getElementById("edit-chambre").value = audience.chambre || "";
      document.getElementById("edit-procedureNumero").value = audience.procedureNumero || "";
      document.getElementById("edit-parties").value = audience.parties || "";
      document.getElementById("edit-qualiteProcedurale").value = audience.qualiteProcedurale || "";
      document.getElementById("edit-objetProcedure").value = audience.objetProcedure || "";
      document.getElementById("edit-dernierMotif").value = audience.dernierMotif || "";
      document.getElementById("edit-diligences").value = audience.diligences || "";
      hideError(document.getElementById("edit-error"));
      editModal.hidden = false;
    }

    document.getElementById("edit-cancel-btn").addEventListener("click", () => {
      editModal.hidden = true;
    });

    document.getElementById("edit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("edit-error");
      hideError(errorEl);
      const id = document.getElementById("edit-id").value;
      const fd = new FormData(e.target);
      try {
        await apiFetch(`/api/role-audiences/${id}`, {
          method: "PATCH",
          body: {
            juridiction: fd.get("juridiction"),
            chambre: fd.get("chambre") || undefined,
            procedureNumero: fd.get("procedureNumero") || undefined,
            parties: fd.get("parties"),
            qualiteProcedurale: fd.get("qualiteProcedurale") || undefined,
            objetProcedure: fd.get("objetProcedure") || undefined,
            dernierMotif: fd.get("dernierMotif") || undefined,
            diligences: fd.get("diligences") || undefined,
          },
        });
        editModal.hidden = true;
        chargerSemaine();
      } catch (err) {
        showError(errorEl, err.message);
      }
    });

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);
      renderFiltresTypes();
      chargerSemaine();
    })();
  </script>
</body>
</html>
