<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Corbeille</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <div class="page-hero">
      <div class="eyebrow">Cabinet</div>
      <h1>Corbeille</h1>
      <p>Dossiers, clients et documents générés supprimés — récupérables pendant 30 jours, puis effacés définitivement.</p>
    </div>

    <div id="error" class="error"></div>

    <div class="card">
      <h2>Dossiers</h2>
      <div id="liste-dossiers"></div>
    </div>

    <div class="card">
      <h2>Clients</h2>
      <div id="liste-clients"></div>
    </div>

    <div class="card">
      <h2>Documents générés</h2>
      <div id="liste-actions"></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/corbeille.js"></script>
</body>
</html>
