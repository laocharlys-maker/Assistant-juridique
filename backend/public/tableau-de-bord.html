<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurore — Tableau de bord</title>
  <link rel="icon" type="image/png" href="/favicon-256.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <h1 id="greeting">Tableau de bord</h1>
    <p class="muted" id="date"></p>

    <div id="error" class="error"></div>

    <div class="tabs" id="scope-tabs" style="display:none;">
      <button class="tab" data-scope="mine">Mes statistiques</button>
      <button class="tab" data-scope="cabinet">Tout le cabinet</button>
    </div>

    <div class="stat-grid" id="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Dossiers actifs</div>
        <div class="stat-value" id="stat-dossiers">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">CR ce mois</div>
        <div class="stat-value" id="stat-cr">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Échéances 7 jours</div>
        <div class="stat-value" id="stat-echeances">—</div>
      </div>
    </div>

    <p class="muted"><a href="/dashboard.html">Voir tous les dossiers →</a></p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    async function loadStats(scope) {
      const errorEl = document.getElementById("error");
      hideError(errorEl);
      try {
        const query = scope ? `?scope=${scope}` : "";
        const stats = await apiFetch(`/api/stats${query}`);
        document.querySelectorAll("#scope-tabs .tab").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.scope === stats.scope);
        });
        document.getElementById("stat-dossiers").textContent = stats.dossiersActifs;
        document.getElementById("stat-cr").textContent = stats.crCeMois;
        document.getElementById("stat-echeances").textContent = stats.echeances7Jours;
      } catch (err) {
        showError(errorEl, err.message);
      }
    }

    (async () => {
      const me = await requireSession();
      if (!me) return;
      initLayout(me);

      if (me.role === "collaborateur") {
        document.querySelector(".page").innerHTML =
          '<p class="error visible">Cette page est réservée aux avocats du cabinet.</p>';
        return;
      }

      document.getElementById("greeting").textContent = `Bonjour, ${me.nom}`;
      document.getElementById("date").textContent = new Date().toLocaleDateString("fr-FR", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });

      document.getElementById("scope-tabs").style.display = "flex";
      document.querySelectorAll("#scope-tabs .tab").forEach((btn) => {
        btn.addEventListener("click", () => loadStats(btn.dataset.scope));
      });

      loadStats();
    })();
  </script>
</body>
</html>
