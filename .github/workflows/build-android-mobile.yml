name: Build Android Aurore Mobile

# Toujours manuel (jamais declenche automatiquement par un push) : un build
# EAS consomme un credit du compte Expo du cabinet, jamais a lancer sans le
# vouloir explicitement. Voir docs/lot10/01-protocole.md (decision du
# 2026-10-09 : EAS Build, jamais un build Gradle local sur ce runner).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil eas.json a construire"
        type: string
        default: "preview"

jobs:
  build-android:
    name: Construire l'APK via EAS Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verifier les types
        run: npm run typecheck

      - name: Tests (crypto, coffre, appairage, cache dossiers)
        run: npm test -- --ci

      - name: Installer eas-cli
        run: npm install --global eas-cli

      - name: Lancer le build EAS (cloud Expo - jamais sur ce runner)
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait --json > /tmp/eas-build-result.json
          cat /tmp/eas-build-result.json
          URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/eas-build-result.json','utf8'))[0].artifacts.buildUrl)")
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Telecharger l'APK produit par EAS
        run: curl -L -o /tmp/aurore-mobile.apk "${{ steps.eas_build.outputs.apk_url }}"

      - name: Publier l'APK comme artefact telechargeable (comme l'installeur Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Aurore-Mobile-Android-${{ inputs.profile }}-${{ github.run_id }}
          path: /tmp/aurore-mobile.apk
          retention-days: 14
