name: Generer la cle de signature updater (usage ponctuel)

# Usage unique (ou tres rare, en cas de rotation de cle) : genere la paire
# de cles Ed25519/minisign attendue par tauri-plugin-updater. La cle
# publique est sans risque a afficher (elle ne sert qu'a VERIFIER une
# signature, jamais a en produire une) - imprimee directement dans le
# resume du job. La cle privee, elle, ne doit JAMAIS apparaitre en clair
# dans les logs : elle est deposee comme artefact GitHub (acces reserve
# aux collaborateurs du depot, retention 1 jour) a recuperer manuellement
# puis a stocker soi-meme comme secret GitHub
# (TAURI_SIGNING_PRIVATE_KEY) avant que l'artefact n'expire.
on:
  workflow_dispatch: {}

jobs:
  generate-updater-key:
    name: Generer la paire de cles
    runs-on: windows-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le CLI Tauri
        run: npm install

      - name: Generer la paire de cles (sans mot de passe - deja chiffree au repos par GitHub Secrets)
        shell: pwsh
        run: |
          npx tauri signer generate -w updater-private.key -p "" --force

      - name: Afficher la cle PUBLIQUE (sans risque - ne sert qu'a verifier)
        shell: pwsh
        run: |
          $pub = Get-Content updater-private.key.pub -Raw
          Write-Output "=== CLE PUBLIQUE (a copier dans src-tauri/tauri.conf.json, plugins.updater.pubkey) ==="
          Write-Output $pub
          "### Cle publique updater`n``````n$pub`n```````n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Deposer la cle PRIVEE comme artefact (jamais dans les logs)
        uses: actions/upload-artifact@v4
        with:
          name: updater-private-key
          path: updater-private.key
          retention-days: 1
