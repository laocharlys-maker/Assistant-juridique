[package]
name = "aurore-desktop"
version = "1.0.0"
description = "Coquille desktop Tauri pour Aurore : lance le backend Express/TS empaquete en executable Node SEA comme sidecar et affiche son interface dans une webview."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Requis explicitement (pas seulement en dependance transitive de tauri) :
# la macro tauri::generate_context!() (voir main.rs, fn main) genere du
# code qui reference serde_json/serde par chemin qualifie, ce qui exige
# qu'ils soient declares comme dependances directes de CE crate - piege
# classique de Tauri v2, absent du Cargo.toml jusqu'ici car aucune commande
# #[tauri::command] (qui aurait, elle, force cette dependance a etre
# ajoutee plus tot) n'existe dans ce projet.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
# Auto-update (Lot 8) : plugin officiel Tauri, pilote entierement depuis
# Rust (voir main.rs/updater.rs) plutot que via l'API JS du plugin - la
# fenetre affiche une page web distante (http://127.0.0.1:3000), pas les
# assets empaquetes par Tauri, donc la disponibilite du pont IPC/JS ne
# peut pas etre verifiee dans cet environnement. updater.rs affiche une
# boite de dialogue NATIVE (tauri-plugin-dialog, ci-dessous) de
# confirmation avant tout telechargement/application, ce qui satisfait
# "jamais de mise a jour silencieuse" sans dependre du contexte web -
# voir README-LOT8.md.
tauri-plugin-updater = "2"
# Boite de dialogue native pour demander confirmation avant toute mise a
# jour (voir main.rs check_for_updates) - choisi plutot qu'une UI web
# personnalisee pour la meme raison que ci-dessus.
tauri-plugin-dialog = "2"
# Client HTTP synchrone minimal (pas de runtime async a gerer) pour le
# health-check du sidecar avant d'afficher l'interface reelle.
ureq = "2"
