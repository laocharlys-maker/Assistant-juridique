<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Aurore</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .wrap {
    text-align: center;
  }
  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 3px solid rgba(226, 232, 240, 0.25);
    border-top-color: #e2e8f0;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  p {
    font-size: 14px;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>Démarrage d'Aurore…</p>
  </div>
</body>
</html>
