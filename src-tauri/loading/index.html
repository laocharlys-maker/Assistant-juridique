<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Aurore</title>
<style>
  :root {
    --bg: #f9f7f2;
    --text: #16233b;
    --muted: #5c6a84;
    --accent: #a97a29;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .screen.visible {
    opacity: 1;
  }

  #screen-logo .logo {
    width: 230px;
    height: auto;
  }

  #screen-brand .wrap {
    text-align: center;
  }
  #screen-brand h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-size: 3.4rem;
    letter-spacing: 0.1em;
    margin: 0 0 10px;
    font-weight: 700;
    color: var(--accent);
  }
  #screen-brand .subtitle {
    font-size: 0.95rem;
    color: var(--muted);
    margin: 0 0 26px;
    letter-spacing: 0.02em;
  }
  .spinner {
    width: 26px;
    height: 26px;
    margin: 0 auto;
    border-radius: 50%;
    border: 3px solid rgba(169, 122, 41, 0.2);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="screen visible" id="screen-logo">
    <img class="logo" src="azomedia-logo.png" alt="AzoMedIA" />
  </div>
  <div class="screen" id="screen-brand">
    <div class="wrap">
      <h1>AURORE</h1>
      <p class="subtitle">Gestion de cabinet d'avocat</p>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    // Ecran 1 (logo AzoMedIA seul) pendant 3s, puis ecran 2 (AURORE +
    // sous-titre + indicateur de chargement discret, sans texte) - reste
    // affiche ensuite jusqu'a ce que main.rs remplace la page une fois le
    // health-check du backend reussi (voir health_url()/app_url()), quelle
    // que soit la duree reelle du demarrage.
    setTimeout(() => {
      document.getElementById("screen-logo").classList.remove("visible");
      document.getElementById("screen-brand").classList.add("visible");
    }, 3000);
  </script>
</body>
</html>
